async function submitAuth(mode){
 const btn=document.querySelector('.authcard .fullbtn'),email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPass').value,m=document.getElementById('authMsg');
 if(!email||!email.includes('@'))return showMsg(m,'Digite um e-mail válido.');
 if(!pass)return showMsg(m,'Digite uma senha.');
 if(mode==='signup'&&pass!==document.getElementById('authPass2').value)return showMsg(m,'As senhas não conferem.');
 if(btn){btn.disabled=true;btn.textContent='CONECTANDO...'}
 try{
  const r=mode==='signup'?await sb.auth.signUp({email,password:pass}):await sb.auth.signInWithPassword({email,password:pass});
  if(r.error)throw r.error;
  if(mode==='signup'&&!r.data.session){showMsg(m,'Perfil criado! Confirme o e-mail e depois entre.',true);return}
  if(!r.data.user)throw new Error('O Supabase não retornou o usuário.');
  await start(r.data.user);
 }catch(e){showMsg(m,e.message||'Não foi possível concluir o acesso.')}finally{if(btn){btn.disabled=false;btn.textContent=mode==='signup'?'CRIAR PERFIL':'ENTRAR'}}
}
function showMsg(el,text,ok=false){el.textContent=text;el.className='msg '+(ok?'ok':'error');el.style.display='block'}
async function forgotPassword(){const email=prompt('Digite o e-mail do perfil:');if(!email)return;const r=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});if(r.error)alert(r.error.message);else alert('Enviamos as instruções de recuperação.')}
async function start(user){v52SetAuthChrome(true);
 if(!user)return;
 state.user=user;
 state.page='myday';
 renderApp();
 try{await loadProfile();renderApp()}catch(e){console.warn('Falha ao carregar perfil',e)}
 try{await loadAll();renderApp()}catch(e){console.error('Falha ao carregar dados',e);toast('Entrou, mas alguns dados não puderam ser carregados.')} 
}
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(r.error)console.warn(r.error);state.profile=r.data||{id:state.user.id,email:state.user.email,role:'admin'}}
async function loadAll(){
 const tables=['note_inbox','customers','leads','products','orders','order_items','tasks','commissions','calendar','coffees','suppliers','movements','expenses','team','receivables','purchases','deliveries','quotes','agent_memory'];
 const results=await Promise.all(tables.map(async t=>{try{const r=await sb.from(t).select('*');if(r.error){console.warn('Erro ao carregar '+t,r.error.message);return [t,[]]}const data=(r.data||[]).slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));return [t,data]}catch(e){console.warn('Tabela indisponível:',t,e);return [t,[]]}}));
 results.forEach(([t,data])=>state[t]=data); state.deliveries=state.deliveries||[]; state.order_items=state.order_items||[]; state.receivables=state.receivables||[]; state.purchases=state.purchases||[];
 if(role()==='admin'){try{const r=await sb.rpc('admin_list_profiles');state.team=r.error?[]:(r.data||[])}catch(e){state.team=[]} try{const r=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(300);state.audit=r.error?[]:(r.data||[])}catch(e){state.audit=[]} } else {state.team=[];state.audit=[]}
 try{await ensureTaskCalendars()}catch(e){console.warn('Sincronização calendário:',e)}
}
async function insert(t,row){const r=await sb.from(t).insert({...row,user_id:state.user.id}).select().single();if(r.error)throw r.error;return r.data}
async function update(t,id,row){const r=await sb.from(t).update(row).eq('id',id);if(r.error)throw r.error;return r.data}
async function remove(t,id){const r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error}

function toggleActivities(){const b=document.getElementById("activityBackdrop");if(!b)return;b.classList.toggle("open");if(b.classList.contains("open"))renderActivityGrid()}
function renderActivityGrid(){const g=document.getElementById("activityGrid");if(!g)return;const visible=menus.filter(([k])=>can(k));g.innerHTML=visible.map(([k,t])=>{const parts=t.split(" ");const ico=parts.shift();const label=parts.join(" ");return `<button class="activity-item ${state.page===k?"active":""}" onclick="goActivity('${k}')"><span class="ico">${ico}</span><span>${label}</span><small>${state.page===k?"Aberta agora":"Abrir atividade"}</small></button>`}).join("")}
function goActivity(p){toggleActivities();go(p)}
function layout(){const visible=menus.filter(([k])=>can(k));document.getElementById("nav").innerHTML=visible.map(([k,t])=>`<button class="${state.page===k?"active":""}" onclick="go('${k}')">${t}</button>`).join('<div class="sep"></div>');document.getElementById("mobilebar").innerHTML="";document.getElementById("userbox").innerHTML=`<div class="useremail">${esc(state.user.email)}</div><span class="badge">${esc(roleNames[role()]||role())}</span><br><br><button class="secondary" style="width:100%" onclick="go('profile')">Abrir PERFIL</button>`;if(document.getElementById("activityBackdrop")?.classList.contains("open"))renderActivityGrid()}
function modal(title,body,save){const x=document.createElement('div');x.className='modalback';x.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="secondary" onclick="this.closest('.modalback').remove()">Fechar</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="secondary" onclick="this.closest('.modalback').remove()">Cancelar</button><button class="primary" id="save">Salvar</button></div></div>`;document.body.appendChild(x);x.querySelector('#save').onclick=async()=>{try{if(await save(x)){x.remove()}}catch(e){alert(e.message||'Erro ao salvar')}}}
function dateBR(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-'}
function monthKey(d){return String(d||'').slice(0,7)}
function monthLabel(k){const [y,m]=k.split('-');return new Date(Number(y),Number(m)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function periodOrders(){return state.orders.filter(o=>monthKey(o.date)===state.period&&o.status!=='Cancelado')}
function completedOrders(){return state.orders.filter(o=>o.status==='Concluído')}
function customerById(id){return state.customers.find(c=>c.id===id)}
function coffeeById(id){return state.coffees.find(c=>c.id===id)}
function inbox(){if(!guard('inbox'))return '';const items=state.inbox||[];return `<div class="top"><div><h1>📥 Caixa de Entrada</h1><div class="muted">Anotações recebidas do iPhone/Notas e transformadas em registros do CRM.</div></div><div class="toolbar"><button class="primary" onclick="newInbox()">+ Importar anotação</button><button class="secondary" onclick="photoInbox()">📷 Foto → CRM</button><input id="photoInboxInput" class="photo-input" type="file" accept="image/*" capture="environment" onchange="processPhotoInbox(this)"></div></div><div class="section"><div class="statusbar">Fluxo: <strong>Nota → PADIM → Revisão → CRM</strong></div>${items.length?items.map(x=>`<div class="card" style="margin:10px 0;padding:16px"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${esc(x.summary||'Anotação')}</strong><div class="muted">${dateBR(x.created_at?.slice(0,10))} · ${esc(x.type||'incerto')}</div></div><span class="badge">${Math.round((x.confidence||0)*100)}%</span></div><p>${esc(x.raw_text)}</p><div class="muted">${x.parsed_json?.type==='pedido' ? `<strong>Cliente:</strong> ${esc(x.parsed_json.customer_name||'-')} · <strong>Itens:</strong> ${(x.parsed_json.items||[]).map(i=>esc(i.coffee_name)+' — '+coffee(i.grams)).join(' · ')||'-'} · <strong>Valor:</strong> ${money(x.parsed_json.total_value||0)}` : (x.parsed_json?esc(JSON.stringify(x.parsed_json,null,2)):'')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="approveInbox('${x.id}')">Revisar/Aplicar</button><button class="secondary" onclick="deleteInbox('${x.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma anotação pendente. Você pode importar uma pelo botão acima.</div>'}</div>`}
async function newInbox(){const text=prompt('Cole aqui a anotação do Notas do iPhone:');if(!text?.trim())return;try{toast('PADIM interpretando a anotação...');const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(SUPABASE_URL+'/functions/v1/cafe-padrim-note-parser',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:text.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao interpretar');const parsed=d.data;const row=await insert('note_inbox',{raw_text:text.trim(),summary:parsed.summary||'',type:parsed.type||'incerto',confidence:Number(parsed.confidence)||0,parsed_json:parsed,status:'pending'});state.inbox.unshift(row);renderApp();toast('Anotação interpretada. Revise antes de aplicar.')}catch(e){alert(e.message||'Erro ao importar')}}
async function approveInbox(id){const x=(state.inbox||[]).find(v=>v.id===id);if(!x)return;const p=x.parsed_json||{};try{if(p.type==='pedido'){const items=Array.isArray(p.items)?p.items.filter(i=>i&&i.coffee_name&&Number(i.grams)>0):[];if(!p.customer_name||!items.length)return alert('Pedido incompleto: preciso do cliente e de pelo menos um café com quantidade.');const customerName=String(p.customer_name).trim();let customer=state.customers.find(c=>c.name.toLowerCase()===customerName.toLowerCase());if(!customer){if(!confirm(`O cliente “${customerName}” não existe. Criar automaticamente?`))return;customer=await insert('customers',{name:customerName,phone:null,email:null,city:null,obs:'Cadastrado a partir das anotações'});state.customers.push(customer)}const resolved=[];for(const item of items){const c=state.coffees.find(c=>c.name.toLowerCase()===String(item.coffee_name).toLowerCase());if(!c)return alert(`Não encontrei o café “${item.coffee_name}”. Cadastre/ajuste o nome em Cafés antes de aplicar.`);const g=grams(item.grams);if(g>Number(c.stock_grams||0))return alert(`Estoque insuficiente de ${c.name}: ${coffee(c.stock_grams)} disponíveis.`);resolved.push({coffee:c,grams:g})}const total=Number(p.total_value)||0;const totalG=resolved.reduce((s,i)=>s+i.grams,0);const parent=await createOrderInternal({customer:customerName,customer_id:customer.id,coffee_id:resolved[0].coffee.id,coffee_grams:resolved[0].grams,total,payment_method:p.payment_method||'Outro',status:'Concluído',date:p.date||dateNow(),notes:`Importado das anotações: ${x.raw_text}`,source_note_id:id});for(const i of resolved){const itemTotal=total>0?total*(i.grams/totalG):0;await insert('order_items',{order_id:parent.id,coffee_id:i.coffee.id,coffee_name:i.coffee.name,grams:i.grams,item_total:itemTotal});if(i!==resolved[0]){i.coffee.stock_grams=Number(i.coffee.stock_grams||0)-i.grams;await update('coffees',i.coffee.id,{stock_grams:i.coffee.stock_grams});await insert('movements',{coffee_id:i.coffee.id,type:'Saída',grams:i.grams,date:p.date||dateNow(),reason:'Pedido importado das anotações'})}}await update('note_inbox',id,{status:'applied'});toast('Pedido importado automaticamente para o CRM.')}else if(p.type==='tarefa'&&p.task_title){await insert('tasks',{title:p.task_title,date:p.task_date||null,status:'A fazer',responsible:null});await update('note_inbox',id,{status:'applied'});toast('Tarefa criada.')}else if(p.type==='estoque'&&p.inventory_grams){const c=state.coffees.find(c=>String(c.name).toLowerCase()===String(p.inventory_coffee_name||'').toLowerCase());if(!c)return alert('Não encontrei o café pelo nome. Abra Estoque e faça o lançamento manual.');const g=Math.abs(Number(p.inventory_grams));if(p.inventory_kind==='Saída'&&g>Number(c.stock_grams||0))return alert('Estoque insuficiente.');c.stock_grams=Number(c.stock_grams||0)+(p.inventory_kind==='Saída'?-g:g);await update('coffees',c.id,{stock_grams:c.stock_grams});await insert('movements',{coffee_id:c.id,type:p.inventory_kind||'Entrada',grams:g,date:p.date||dateNow(),reason:'Importado das anotações'});await update('note_inbox',id,{status:'applied'});toast('Movimentação aplicada.')}else if(p.type==='despesa'&&p.expense_amount){await insert('expenses',{description:p.expense_description||p.summary||'Despesa importada',amount:Number(p.expense_amount),category:'Importada',date:p.date||dateNow()});await update('note_inbox',id,{status:'applied'});toast('Despesa registrada.')}else{alert('A anotação precisa de revisão manual antes de virar um registro.')}await loadAll();renderApp()}catch(e){alert(e.message||'Não foi possível aplicar a anotação.')}}
async function deleteInbox(id){if(!confirm('Excluir esta anotação?'))return;await remove('note_inbox',id);state.inbox=state.inbox.filter(x=>x.id!==id);renderApp()}
function dashboard(){const done=completedOrders(),rev=done.reduce((s,o)=>s+Number(o.total||0),0),sold=done.reduce((s,o)=>s+Number(o.coffee_grams||0),0),exp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),com=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0),stock=state.coffees.reduce((s,c)=>s+Number(c.stock_grams||0),0),result=rev-exp-com,low=state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0));const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);const k=d.toISOString().slice(0,7);return{k,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),value:done.filter(o=>monthKey(o.date)===k).reduce((s,o)=>s+Number(o.total||0),0)}}),max=Math.max(...months.map(m=>m.value),1);const topCustomers=[...state.customers].map(c=>({c,total:done.filter(o=>o.customer_id===c.id||(!o.customer_id&&o.customer===c.name)).reduce((s,o)=>s+Number(o.total||0),0)})).sort((a,b)=>b.total-a.total).slice(0,5);return `<div class="top"><div><h1>Dashboard</h1><div class="muted">Visão geral da operação e dos resultados</div></div><button class="primary" onclick="go('myday')">🏠 Meu Dia</button></div><div class="cards"><div class="card"><div class="muted">Faturamento concluído</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(result)}</div></div><div class="card"><div class="muted">Café vendido</div><div class="metric">${coffee(sold)}</div></div><div class="card"><div class="muted">Estoque atual</div><div class="metric">${coffee(stock)}</div><div class="forecast">${low.length?low.length+" item(ns) em nível crítico":"Estoque dentro do mínimo"}</div></div></div><div class="grid"><div class="section"><h2>Faturamento — últimos 6 meses</h2><div class="bars">${months.map(m=>`<div class="baritem"><div class="barvalue">${money(m.value)}</div><div class="bar"><span style="height:${Math.max(4,m.value/max*150)}px"></span></div><div class="barlabel">${esc(m.label)}</div></div>`).join('')}</div></div><div class="section"><h2>Alertas</h2>${low.length?low.map(c=>`<div class="lead"><strong>⚠️ ${esc(c.name)}</strong><span class="badge danger">${coffee(c.stock_grams)} · mínimo ${coffee(c.min_stock_grams)}</span></div>`).join(''):'<div class="empty">Estoque saudável.</div>'}</div></div><div class="grid3"><div class="section"><h2>Pedidos no mês</h2><div class="metric">${periodOrders().length}</div><div class="muted">${monthLabel(state.period)}</div></div><div class="section"><h2>Leads ativos</h2><div class="metric">${state.leads.filter(l=>l.stage!=='Venda realizada').length}</div><div class="muted">Oportunidades abertas</div></div><div class="section"><h2>Clientes</h2><div class="metric">${state.customers.length}</div><div class="muted">Base cadastrada</div></div></div><div class="grid"><div class="section"><h2>Melhores clientes</h2>${topCustomers.map(x=>`<div class="lead"><strong>${esc(x.c.name)}</strong><span class="muted">${money(x.total)} em vendas concluídas</span></div>`).join('')||'<div class="empty">Cadastre clientes para acompanhar recorrência.</div>'}</div><div class="section"><h2>Próximas obrigações</h2>${state.calendar.filter(e=>!e.completed&&e.date>=dateNow()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(e=>`<div class="lead"><strong>${esc(e.title)}</strong><span class="muted">${dateBR(e.date)} · ${esc(e.type||'Obrigação')}</span></div>`).join('')||'<div class="empty">Nenhuma obrigação próxima.</div>'}</div></div>`}
function customers(){const q=state.search.toLowerCase();const list=state.customers.filter(c=>`${c.name} ${c.phone||''} ${c.email||''}`.toLowerCase().includes(q));return `<div class="top"><div><h1>Clientes</h1><div class="muted">Histórico de relacionamento, pedidos e recorrência</div></div><button class="primary" onclick="newCustomer()">+ Cliente</button></div><div class="section"><div class="search"><input class="input" placeholder="Buscar cliente..." value="${esc(state.search)}" oninput="state.search=this.value;renderApp()"></div>${list.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Contato</th><th>Pedidos</th><th>Total comprado</th><th>Última compra</th><th>Ações</th></tr>${list.map(c=>{const os=state.orders.filter(o=>o.customer_id===c.id||(!o.customer_id&&o.customer===c.name));const done=os.filter(o=>o.status==='Concluído');const total=done.reduce((s,o)=>s+Number(o.total||0),0);const last=done.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];return `<tr><td><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.city||'')}</span><br><span class="v51-health ${v51CustomerHealth(c).cls}">${v51CustomerHealth(c).label}</span></td><td>${esc(c.phone||c.email||'-')}</td><td>${os.length}</td><td>${money(total)}</td><td>${dateBR(last?.date)}</td><td><button class="secondary" onclick="customerDetail('${c.id}')">Ver</button> <button class="secondary" onclick="customerWhatsapp('${c.id}')">💬</button> <button class="secondary" onclick="editCustomer('${c.id}')">Editar</button> <button class="dangerbtn" onclick="deleteCustomer('${c.id}')">Apagar</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Nenhum cliente encontrado.</div>'}</div>`}

/* V50 — Núcleo de operação conectada */
async function createOrderBundle(row){
  const {data,error}=await sb.rpc('create_order_bundle',{
    p_customer_name:row.customer,
    p_customer_id:row.customer_id||null,
    p_coffee_id:row.coffee_id||null,
    p_grams:Number(row.coffee_grams||0),
    p_total:Number(row.total||0),
    p_date:row.date||dateNow(),
    p_delivery_date:row.delivery_date||null,
    p_delivery_required:!!row.delivery_required,
    p_payment_method:row.payment_method||'Outro',
    p_notes:row.notes||'',
    p_responsible:row.responsible||null
  });
  if(error)throw error;
  return data;
}
function relationLabel(o){
  const links=[];
  if(o.delivery_required)links.push('🚚 Entrega');
  if(o.payment_status==='A receber')links.push('💳 A receber');
  if(o.customer_id)links.push('👤 Cliente');
  if(o.coffee_id)links.push('☕ Café');
  return links.join(' · ');
}
async function ensureOrderRelations(o){
  if(!o||!o.id)return;
  // Existing orders are not silently recreated. We only add missing links when a delivery is explicitly requested.
  if(o.delivery_required && !state.deliveries?.some(d=>d.order_id===o.id)){
    const r=await insert('deliveries',{order_id:o.id,customer_id:o.customer_id||null,scheduled_date:o.delivery_date||o.date,status:'Agendada',responsible:o.responsible||null,notes:o.notes||''});

    await insert('tasks',{title:`Entregar pedido · ${o.customer}`,date:o.delivery_date||o.date,status:'A fazer',responsible:o.responsible||null,order_id:o.id});
  }
}
function v50CrossModuleBar(){

async function createOrderInternal(row){
 if(row.delivery_required)return (await createOrderBundle(row)).order;
 const coffeeObj=row.coffee_id?coffeeById(row.coffee_id):null;
 const gramsValue=grams(row.coffee_grams);
 const nowDone=row.status==='Concluído';
 if(nowDone&&coffeeObj&&gramsValue>Number(coffeeObj.stock_grams||0))throw new Error(`Estoque insuficiente de ${coffeeObj.name}.`);
 if(nowDone&&coffeeObj&&gramsValue>0){
   coffeeObj.stock_grams=Number(coffeeObj.stock_grams||0)-gramsValue;
   await update('coffees',coffeeObj.id,{stock_grams:coffeeObj.stock_grams});
   await insert('movements',{coffee_id:coffeeObj.id,type:'Saída',grams:gramsValue,date:row.date||dateNow(),reason:'Pedido concluído'});
 }
 const safe={customer:row.customer,customer_id:row.customer_id||null,coffee_id:row.coffee_id||null,coffee_grams:gramsValue,total:Number(row.total||0),payment_method:row.payment_method||'Outro',status:row.status||'Novo',date:row.date||dateNow(),notes:row.notes||'',responsible:row.responsible||null,delivery_required:false,delivery_status:'Sem entrega',payment_status:['Pix','Dinheiro','Cartão'].includes(row.payment_method)?'Pago':'A receber',stock_applied:nowDone};
 return await insert('orders',safe);
}

e}

async function ensureTaskCalendars(){for(const t of state.tasks){if(!t.date)continue;const linked=state.calendar.find(e=>e.task_id===t.id);if(!linked){try{const r=await insert('calendar',{title:t.title,date:t.date,type:'Tarefa',notes:'Sincronizado automaticamente.',completed:t.status==='Concluída',task_id:t.id});state.calendar.push(r)}catch(e){console.warn(e)}}}}
async function syncTaskCalendar(t){const linked=state.calendar.find(e=>e.task_id===t.id);if(t.date){const row={title:t.title,date:t.date,type:'Tarefa',notes:'Sincronizado automaticamente.',completed:t.status==='Concluída',task_id:t.id};if(linked){await update('calendar',linked.id,row);Object.assign(linked,row)}else state.calendar.push(await insert('calendar',row))}else if(linked){await remove('calendar',linked.id);state.calendar=state.calendar.filter(e=>e.id!==linked.id)}}
async function saveTask(x,id=null){const row={title:x.querySelector('#title').value.trim(),date:x.querySelector('#date').value||null,responsible:x.querySelector('#responsible').value.trim()};if(!row.title)return false;if(id){await update('tasks',id,row);Object.assign(state.tasks.find(t=>t.id===id),row);await syncTaskCalendar(state.tasks.find(t=>t.id===id))}else{const t=await insert('tasks',{...row,status:'A fazer'});state.tasks.push(t);await syncTaskCalendar(t)}renderApp();return true}function newTask(){modal('Nova tarefa',taskForm(),x=>saveTask(x))}function editTask(id){modal('Editar tarefa',taskForm(state.tasks.find(t=>t.id===id)),x=>saveTask(x,id))}async function completeTask(id){const t=state.tasks.find(x=>x.id===id);t.status=t.status==='Concluída'?'A fazer':'Concluída';await update('tasks',id,{status:t.status});await syncTaskCalendar(t);renderApp()}async function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!confirm(`Apagar ${t.title}?`))return;const linked=state.calendar.find(e=>e.task_id===id);if(linked)await remove('calendar',linked.id);await remove('tasks',id);state.tasks=state.tasks.filter(x=>x.id!==id);state.calendar=state.calendar.filter(e=>e.task_id!==id);renderApp()}
function finance(){const rev=completedOrders().reduce((s,o)=>s+Number(o.total||0),0),exp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),com=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0),res=rev-exp-com;return `<div class="top"><div><h1>Financeiro</h1><div class="muted">Entradas, despesas, comissões e resultado estimado</div></div><button class="primary" onclick="newExpense()">+ Despesa</button></div><div class="cards"><div class="card"><div class="muted">Receita</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="muted">Despesas</div><div class="metric">${money(exp)}</div></div><div class="card"><div class="muted">Comissões</div><div class="metric">${money(com)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(res)}</div></div></div><div class="section" style="margin-top:14px"><h2>Despesas</h2>${state.expenses.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Ação</th></tr>${state.expenses.slice().reverse().map(e=>`<tr><td>${dateBR(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category||'-')}</td><td>${money(e.amount)}</td><td><button class="dangerbtn" onclick="deleteExpense('${e.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma despesa.</div>'}</div>`}
function newExpense(){modal('Nova despesa',`<label>Descrição</label><input class="input" id="description" placeholder="Frete, embalagem..."><div class="formgrid"><div><label>Categoria</label><select class="input" id="category"><option>Compra de café</option><option>Frete</option><option>Embalagem</option><option>Operacional</option><option>Marketing</option><option>Outro</option></select></div><div><label>Valor</label><input class="input" id="amount" type="number" min="0" step="0.01"></div><div><label>Data</label><input class="input" id="date" type="date" value="${dateNow()}"></div></div>`,async x=>{const description=x.querySelector('#description').value.trim(),amount=Number(x.querySelector('#amount').value)||0;if(!description||amount<=0)return false;state.expenses.push(await insert('expenses',{description,category:x.querySelector('#category').value,amount,date:x.querySelector('#date').value}));renderApp();return true})}async function deleteExpense(id){if(!confirm('Apagar despesa?'))return;await remove('expenses',id);state.expenses=state.expenses.filter(e=>e.id!==id);renderApp()}
function commission(){return `<div class="top"><div><h1>Comissão</h1><div class="muted">Valores definidos para a equipe</div></div><button class="primary" onclick="newCommission()">+ Comissão</button></div><div class="section">${state.commissions.length?`<div class="tablewrap"><table><tr><th>Nome</th><th>Valor</th><th>Data</th><th>Ações</th></tr>${state.commissions.slice().reverse().map(c=>`<tr><td>${esc(c.name)}</td><td>${money(c.amount)}</td><td>${dateBR(c.created_at?.slice(0,10))}</td><td><button class="secondary" onclick="editCommission('${c.id}')">Editar</button> <button class="dangerbtn" onclick="deleteCommission('${c.id}')">Remover</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma comissão.</div>'}</div>`}
function commissionForm(c={}){return `<label>Nome</label><input class="input" id="name" value="${esc(c.name||'')}"><label>Valor</label><input class="input" id="amount" type="number" min="0" step="0.01" value="${Number(c.amount||0)}">`}
async function saveCommission(x,id=null){const row={name:x.querySelector('#name').value.trim(),amount:Number(x.querySelector('#amount').value)||0};if(!row.name)return false;if(id){await update('commissions',id,row);Object.assign(state.commissions.find(c=>c.id===id),row)}else state.commissions.push(await insert('commissions',row));renderApp();return true}function newCommission(){modal('Nova comissão',commissionForm(),x=>saveCommission(x))}function editCommission(id){modal('Editar comissão',commissionForm(state.commissions.find(c=>c.id===id)),x=>saveCommission(x,id))}async function deleteCommission(id){if(!confirm('Remover comissão?'))return;await remove('commissions',id);state.commissions=state.commissions.filter(c=>c.id!==id);renderApp()}
function calendar(){const first=new Date(state.calendarYear,state.calendarMonth-1,1),days=new Date(state.calendarYear,state.calendarMonth,0).getDate(),start=(first.getDay()+6)%7,cells=[];for(let i=0;i<start;i++)cells.push('<div class="calday emptyday"></div>');for(let d=1;d<=days;d++){const ds=`${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=state.calendar.filter(e=>e.date===ds);cells.push(`<div style="min-height:105px;background:#f8f4f0;border:1px solid var(--line);border-radius:10px;padding:7px"><div style="display:flex;justify-content:space-between"><strong>${d}</strong><button class="secondary" style="padding:2px 7px" onclick="newCalendarEvent('${ds}')">+</button></div>${ev.map(e=>`<div class="calevent ${e.completed?'done':''}" style="background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px;margin:4px 0;font-size:11px"><span onclick="toggleCalendarEvent('${e.id}')" style="cursor:pointer">${e.completed?'✓':'○'} ${esc(e.title)}${e.task_id?' <small>(Tarefa)</small>':''}</span>${e.task_id?'':'<button style="border:0;background:none;color:var(--danger)" onclick="deleteCalendarEvent(\''+e.id+'\')">×</button>'}</div>`).join('')}</div>`)}return `<div class="top"><div><h1>Calendário</h1><div class="muted">Obrigações, tarefas e entregas</div></div><div class="toolbar"><button class="secondary" onclick="changeMonth(-1)">←</button><strong>${monthLabel(`${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}`)}</strong><button class="secondary" onclick="changeMonth(1)">→</button></div></div><div class="section"><div style="display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;overflow:auto"><div class="muted">SEG</div><div class="muted">TER</div><div class="muted">QUA</div><div class="muted">QUI</div><div class="muted">SEX</div><div class="muted">SÁB</div><div class="muted">DOM</div>${cells.join('')}</div></div>`}
function changeMonth(d){state.calendarMonth+=d;if(state.calendarMonth>12){state.calendarMonth=1;state.calendarYear++}if(state.calendarMonth<1){state.calendarMonth=12;state.calendarYear--}renderApp()}
function newCalendarEvent(date){modal('Nova obrigação',`<label>Obrigação</label><input class="input" id="title"><label>Data</label><input class="input" id="date" type="date" value="${date}"><label>Tipo</label><select class="input" id="type"><option>Obrigação</option><option>Pagamento</option><option>Reunião</option><option>Entrega</option><option>Vencimento</option><option>Outro</option></select><label>Observação</label><textarea class="input" id="notes" rows="3"></textarea>`,async x=>{const title=x.querySelector('#title').value.trim();if(!title)return false;state.calendar.push(await insert('calendar',{title,date:x.querySelector('#date').value,type:x.querySelector('#type').value,notes:x.querySelector('#notes').value.trim(),completed:false}));renderApp();return true})}async function toggleCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);e.completed=!e.completed;await update('calendar',id,{completed:e.completed});if(e.task_id){const t=state.tasks.find(t=>t.id===e.task_id);if(t){t.status=e.completed?'Concluída':'A fazer';await update('tasks',t.id,{status:t.status})}}renderApp()}async function deleteCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);if(!confirm('Remover obrigação?'))return;await remove('calendar',id);state.calendar=state.calendar.filter(x=>x.id!==id);renderApp()}
function team(){if(!guard('team'))return '';return `<div class="top"><div><h1>👥 Usuários e permissões</h1><div class="muted">Controle de funções e acesso do CRM</div></div></div><div class="section"><div class="statusbar">Seu acesso: <strong>${esc(state.user.email)}</strong> · <strong>${esc(roleNames[role()]||role())}</strong></div><p class="muted">Os perfis abaixo são contas reais do Supabase. O Administrador pode alterar a função de cada conta; as regras também são protegidas no banco.</p>${state.team.length?`<div class="tablewrap"><table><tr><th>E-mail</th><th>Função</th><th>Ação</th></tr>${state.team.map(u=>`<tr><td>${esc(u.email||'')}</td><td><span class="badge">${esc(roleNames[u.role]||u.role)}</span></td><td><select class="input" style="min-width:170px" onchange="changeUserRole('${u.id}',this.value)">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma conta encontrada.</div>'}</div><div class="section"><h2>Modelo de acesso</h2><div class="chips">${Object.entries(roleNames).map(([k,v])=>`<span class="chip"><strong>${v}</strong>: ${(rolePerms[k]||[]).length} módulos</span>`).join('')}</div></div>`} 
async function changeUserRole(id,newRole){if(!guard('team'))return;if(!confirm(`Alterar função para ${roleNames[newRole]}?`))return;const r=await sb.rpc('admin_set_user_role',{target_user_id:id,new_role:newRole});if(r.error){alert(r.error.message);return}toast('Função atualizada.');await loadProfile();await loadAll();renderApp()}
async function sendAgent(){const input=document.getElementById('agentInput');const msg=input?.value.trim();if(!msg)return;const history=state.agentHistory||[];state.agentHistory=history;state.agentHistory.push({role:'user',content:msg});renderAgentMessages();input.value='';const status=document.getElementById('agentStatus');if(status)status.textContent='Consultando dados atuais do CRM e executando o que for necessário...';try{const session=(await sb.auth.getSession()).data.session;if(!session)throw new Error('Sessão expirada. Entre novamente.');const r=await fetch(`${SUPABASE_URL}/functions/v1/cafe-padrim-agent`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({message:msg,history:history.slice(-11)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível falar com o agente.');state.agentHistory.push({role:'assistant',content:data.reply||'Sem resposta.'});await loadAll();renderApp()}catch(e){state.agentHistory.push({role:'assistant',content:`Não consegui concluir: ${e.message}`});renderAgentMessages()}finally{const st=document.getElementById('agentStatus');if(st)st.textContent='Dados consultados em tempo real a cada solicitação.'}}
function renderAgentMessages(){const box=document.getElementById('agentMessages');if(!box)return;box.innerHTML=(state.agentHistory||[]).map(m=>`<div class="bubble ${m.role==='user'?'user':'agent'}"><strong>${m.role==='user'?'Você':'PADIM'}</strong><br>${esc(m.content)}</div>`).join('')||'<div class="empty">Comece uma conversa com o PADIM.</div>';box.scrollTop=box.scrollHeight}
function togglePadim(){const p=document.getElementById('padimPanel');if(!p)return;p.classList.toggle('open');if(p.classList.contains('open')){renderPadimMessages();setTimeout(()=>document.getElementById('padimInput')?.focus(),80)}}
function renderPadimMessages(){const box=document.getElementById('padimMessages');if(!box)return;if(!state.agentHistory.length)state.agentHistory=[{role:'assistant',content:'Olá! Eu sou o PADIM, agente operacional do CAFÉ DO PADRIM. Posso consultar os dados atuais do CRM e executar atividades. Ex.: “crie uma tarefa para amanhã para ligar para João” ou “qual café está abaixo do estoque mínimo?”'}];box.innerHTML=state.agentHistory.map(m=>`<div class="bubble ${m.role==='user'?'user':'agent'}"><strong>${m.role==='user'?'Você':'PADIM'}</strong><br>${esc(m.content)}</div>`).join('');box.scrollTop=box.scrollHeight}
function agentQuickFloating(t){const i=document.getElementById('padimInput');if(i){i.value=t;sendAgentFloating()}}
async function sendAgentFloating(){
 const input=document.getElementById('padimInput');const msg=input?.value.trim();if(!msg)return;
 const history=state.agentHistory||[];state.agentHistory=history;state.agentHistory.push({role:'user',content:msg});
 input.value='';renderPadimMessages();const status=document.getElementById('padimStatus');if(status)status.textContent='Consultando dados atuais do CRM...';
 try{
  const session=(await sb.auth.getSession()).data.session;if(!session)throw new Error('Sessão expirada. Entre novamente.');
  const r=await fetch(`${SUPABASE_URL}/functions/v1/cafe-padrim-agent`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({message:msg,history:history.slice(-11),context:v51ContextForPadim()})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível falar com o agente.');
  state.agentHistory.push({role:'assistant',content:data.reply||'Sem resposta.'});await loadAll();renderApp();setTimeout(renderPadimMessages,0)
 }catch(e){state.agentHistory.push({role:'assistant',content:`Não consegui concluir: ${e.message}`});renderPadimMessages()}
 finally{const st=document.getElementById('padimStatus');if(st)st.textContent='Dados consultados em tempo real.'}
}

function agent(){if(!state.agentHistory.length)state.agentHistory=[{role:'assistant',content:'Olá! Eu sou o PADIM, agente operacional do CAFÉ DO PADRIM. Consulto os dados atuais do CRM a cada solicitação, organizo informações e posso executar atividades. Ex.: “crie uma tarefa para amanhã para ligar para João” ou “qual café está abaixo do estoque mínimo?”'}];return `<div class="top"><div><h1>🤖 Agente PADIM</h1><div class="muted">Agente operacional conectado aos dados atuais do CRM</div></div><div class="toolbar"><button class="secondary" onclick="state.agentHistory=[];renderApp()">Nova conversa</button><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar dados</button></div></div><div class="section"><div class="agentquick"><button onclick="agentQuickFloating('Faça um resumo da operação atual.')">Resumo da operação</button><button onclick="agentQuickFloating('Quais cafés precisam de reposição?')">Estoque</button><button onclick="agentQuickFloating('Quais tarefas e obrigações estão pendentes?')">Pendências</button><button onclick="agentQuickFloating('Quais são os melhores clientes por vendas concluídas?')">Melhores clientes</button></div><div class="agentbox"><div id="agentMessages" class="agentmessages"></div><div id="agentStatus" class="agentstatus">Dados consultados em tempo real a cada solicitação.</div><div class="agentcomposer"><textarea id="agentInput" class="input" placeholder="Converse com o PADIM..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAgent()}"></textarea><button class="primary" onclick="sendAgent()">Enviar</button></div></div></div>`}
function agentQuick(t){const i=document.getElementById('agentInput');if(i){i.value=t;sendAgent()}}

function daysFromToday(date){if(!date)return 9999;return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}
function completedRevenue(){return state.orders.filter(o=>o.status==='Concluído').reduce((s,o)=>s+Number(o.total||0),0)}
function myDay(){if(!guard('myday'))return '';const today=dateNow();const overdueTasks=state.tasks.filter(t=>t.status!=='Concluída'&&t.date&&t.date<today);const todayTasks=state.tasks.filter(t=>t.status!=='Concluída'&&t.date===today);const due=state.receivables.filter(r=>r.status!=='Pago').sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date)));const lateReceivables=due.filter(r=>r.due_date&&r.due_date<today);const upcoming=state.calendar.filter(e=>!e.completed&&e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);const low=state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0));const stale=state.customers.filter(c=>{const os=state.orders.filter(o=>o.customer_id===c.id&&o.status==='Concluído');const last=os.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];return last&&daysFromToday(last.date)>30}).slice(0,6);return `<div class="top"><div><h1>🏠 Meu Dia</h1><div class="muted">Tudo que merece sua atenção hoje, em um só lugar.</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="heroAction"><div><strong>Bom dia! 👋</strong><div class="muted">O PADIM organizou os principais pontos da operação.</div></div><button class="primary" onclick="togglePadim();setTimeout(()=>{const i=document.getElementById('padimInput');if(i){i.value='Analise o que eu preciso priorizar hoje.';sendAgentFloating()}},120)">🤖 Perguntar ao PADIM</button></div><div class="grid4"><div class="kpi"><span>Pedidos hoje</span><strong>${state.orders.filter(o=>o.date===today&&o.status!=='Cancelado').length}</strong></div><div class="kpi"><span>Tarefas atrasadas</span><strong>${overdueTasks.length}</strong></div><div class="kpi"><span>A receber</span><strong>${money(due.reduce((s,r)=>s+Number(r.amount||0),0))}</strong></div><div class="kpi"><span>Estoque crítico</span><strong>${low.length}</strong></div></div><div class="grid"><div class="section"><h2>🔴 Precisa de atenção</h2><div class="actionlist">${lateReceivables.slice(0,4).map(r=>`<div class="alertrow"><div><strong><span class="priority-dot red"></span>${esc(r.description||'Conta a receber')}</strong><span class="muted">${esc(r.customer_name||'')} · vencida em ${dateBR(r.due_date)}</span></div><strong>${money(r.amount)}</strong></div>`).join('')}${overdueTasks.slice(0,4).map(t=>`<div class="alertrow"><div><strong><span class="priority-dot red"></span>${esc(t.title)}</strong><span class="muted">Tarefa atrasada · ${dateBR(t.date)}</span></div><button class="secondary" onclick="go('tasks')">Resolver</button></div>`).join('')}${low.slice(0,4).map(c=>`<div class="alertrow"><div><strong><span class="priority-dot"></span>${esc(c.name)}</strong><span class="muted">Estoque ${coffee(c.stock_grams)} · mínimo ${coffee(c.min_stock_grams)}</span></div><button class="secondary" onclick="go('inventory')">Repor</button></div>`).join('')}${!lateReceivables.length&&!overdueTasks.length&&!low.length?'<div class="empty">Nenhuma urgência encontrada. Operação em dia. ✅</div>':''}</div></div><div class="section"><h2>📅 Hoje e próximos dias</h2>${todayTasks.map(t=>`<div class="alertrow"><div><strong>${esc(t.title)}</strong><span class="muted">Hoje · ${esc(t.responsible||'Sem responsável')}</span></div><button class="secondary" onclick="go('tasks')">Abrir</button></div>`).join('')}${upcoming.map(e=>`<div class="alertrow"><div><strong>${esc(e.title)}</strong><span class="muted">${dateBR(e.date)} · ${esc(e.type||'Obrigação')}</span></div><button class="secondary" onclick="go('calendar')">Abrir</button></div>`).join('')||'<div class="empty">Nenhum compromisso próximo.</div>'}</div></div><div class="grid"><div class="section"><h2>👤 Clientes para reativar</h2>${stale.map(c=>`<div class="alertrow"><div><strong>${esc(c.name)}</strong><span class="muted">Mais de 30 dias sem compra</span></div><button class="secondary" onclick="whatsappCustomer('${esc(c.phone||'')}','Olá, ${esc(c.name)}! Tudo bem? Posso te ajudar com uma nova reposição de café?')">💬 WhatsApp</button></div>`).join('')||'<div class="empty">Nenhum cliente parado por enquanto.</div>'}</div><div class="section"><h2>🤖 Sugestão</h2><p>Use o PADIM para resumir a operação, criar tarefas, registrar despesas ou identificar clientes que precisam de contato.</p><button class="primary" onclick="togglePadim()">Abrir PADIM</button></div></div>`}
function alerts(){if(!guard('alerts'))return '';const today=dateNow();const items=[];state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0)).forEach(c=>items.push({p:'Alta',title:'Estoque abaixo do mínimo',desc:`${c.name}: ${coffee(c.stock_grams)} disponíveis.`}));state.tasks.filter(t=>t.status!=='Concluída'&&t.date&&t.date<today).forEach(t=>items.push({p:'Alta',title:'Tarefa atrasada',desc:`${t.title} · ${dateBR(t.date)}`}));state.receivables.filter(r=>r.status!=='Pago'&&r.due_date<today).forEach(r=>items.push({p:'Alta',title:'Conta vencida',desc:`${r.description||'Conta'} · ${money(r.amount)}`}));state.leads.filter(l=>l.stage!=='Venda realizada'&&l.updated_at&&daysFromToday(l.updated_at.slice(0,10))>7).forEach(l=>items.push({p:'Média',title:'Lead parado',desc:`${l.name||'Lead'} sem atualização há mais de 7 dias.`}));return `<div class="top"><div><h1>🔔 Alertas</h1><div class="muted">Problemas e oportunidades que merecem atenção.</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="section">${items.length?items.map(i=>`<div class="alertrow"><div><strong><span class="priority-dot ${i.p==='Alta'?'red':''}"></span>${esc(i.title)}</strong><span class="muted">${esc(i.desc)}</span></div><span class="badge ${i.p==='Alta'?'danger':'warn'}">${i.p}</span></div>`).join(''):'<div class="empty">Nenhum alerta. Tudo tranquilo. ✅</div>'}</div>`}

function v51GlobalSearch(){
 const q=(document.getElementById('v51GlobalSearch')?.value||'').trim().toLowerCase();
 if(!q)return;
 const customers=(state.customers||[]).filter(c=>`${c.name} ${c.phone||''} ${c.email||''}`.toLowerCase().includes(q)).slice(0,6);
 const orders=(state.orders||[]).filter(o=>`${o.customer||''} ${o.id||''} ${o.status||''}`.toLowerCase().includes(q)).slice(0,6);
 const leads=(state.leads||[]).filter(l=>`${l.name||''} ${l.phone||''} ${l.stage||''}`.toLowerCase().includes(q)).slice(0,6);
 const coffees=(state.coffees||[]).filter(c=>`${c.name||''} ${c.origin||''} ${c.producer||''}`.toLowerCase().includes(q)).slice(0,6);
 modal(`Busca · ${esc(q)}`,`
 <div class="v51-linked"><strong>👥 Clientes</strong>${customers.map(c=>`<div class="alertrow"><div><strong>${esc(c.name)}</strong><span class="muted">${esc(c.phone||c.email||'')}</span></div><button class="secondary" onclick="customerDetail('${c.id}');this.closest('.modalback')?.remove()">Abrir</button></div>`).join('')||'<div class="empty">Nenhum cliente.</div>'}</div>
 <div class="v51-linked"><strong>📦 Pedidos</strong>${orders.map(o=>`<div class="alertrow"><div><strong>${esc(o.customer)}</strong><span class="muted">#${String(o.id).slice(0,8)} · ${dateBR(o.date)} · ${money(o.total)}</span></div><button class="secondary" onclick="orderDetail('${o.id}');this.closest('.modalback')?.remove()">Abrir</button></div>`).join('')||'<div class="empty">Nenhum pedido.</div>'}</div>
 <div class="v51-linked"><strong>🎯 Leads</strong>${leads.map(l=>`<div class="alertrow"><div><strong>${esc(l.name)}</strong><span class="muted">${esc(l.stage||'')}</span></div><button class="secondary" onclick="go('leads');this.closest('.modalback')?.remove()">Abrir</button></div>`).join('')||'<div class="empty">Nenhum lead.</div>'}</div>
 <div class="v51-linked"><strong>☕ Cafés</strong>${coffees.map(c=>`<div class="alertrow"><div><strong>${esc(c.name)}</strong><span class="muted">Estoque ${coffee(c.stock_grams)}</span></div><button class="secondary" onclick="go('inventory');this.closest('.modalback')?.remove()">Estoque</button></div>`).join('')||'<div class="empty">Nenhum café.</div>'}</div>
 `,async()=>true)
}
function v51CustomerHealth(c){
 const os=(state.orders||[]).filter(o=>o.customer_id===c.id&&o.status==='Concluído');
 if(!os.length)return {cls:'warn',label:'Novo'};
 os.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const days=daysFromToday(os[0].date);
 return days<=35?{cls:'ok',label:'Ativo'}:days<=60?{cls:'warn',label:'Atenção'}:{cls:'bad',label:'Inativo'};
}

if(['orders','customers','myday','calendar','finance','receivables','inventory','quotes'].includes(state.page)){

if(state.page==='agent')requestAnimationFrame(renderAgentMessages);}

(function(){
  const originalRenderApp=window.renderApp;
  const originalOrderDetail=window.orderDetail;
  const originalMyDay=window.myDay;

  function safeCan(k){try{return typeof can==='function'?can(k):true}catch(e){return true}}
  function v59PostRender(){
    try{
      const logged=!!state.user;
      document.body.classList.toggle('crm-ready',logged);
      const act=document.getElementById('v49MobileActivity');
      const plus=document.querySelector('.v51-floating-new');
      const gb=document.getElementById('v51GlobalBar');
      [act,plus,gb].forEach(el=>{if(el)el.style.display=logged?(el===gb?'flex':''):'none'});
      const oldBar=document.getElementById('mobilebar'); if(oldBar)oldBar.style.display='none';
      if(!logged)return;
      if(state.page==='myday')v59AddPriority();
      if(state.page==='orders')v59AddOrdersSummary();
    }catch(e){console.warn('V61 UI:',e)}
  }
  function v59AddPriority(){
    const app=document.getElementById('app');if(!app||document.getElementById('v59Priority'))return;
    const today=typeof dateNow==='function'?dateNow():new Date().toISOString().slice(0,10);
    const tasks=(state.tasks||[]).filter(t=>t.status!=='Concluída');
    const overdue=tasks.filter(t=>t.date&&t.date<today).length;
    const todayTasks=tasks.filter(t=>t.date===today).length;
    const deliveries=(state.deliveries||[]).filter(d=>d.scheduled_date===today&&d.status!=='Entregue');
    const receivables=(state.receivables||[]).filter(r=>r.status!=='Pago'&&r.status!=='Cancelado');
    const totalRec=receivables.reduce((s,r)=>s+Math.max(0,Number(r.amount||0)-Number(r.paid_amount||0)),0);
    const critical=(state.coffees||[]).filter(c=>Number(c.stock_grams||0)-Number(c.reserved_grams||0)<=Number(c.min_stock_grams||0)).length;
    const el=document.createElement('div');el.id='v59Priority';el.className='v59-priority';
    el.innerHTML=`<div class="tile"><div class="k">Hoje</div><div class="v">${deliveries.length}</div><div class="s">entregas</div></div>
      <div class="tile"><div class="k">Tarefas</div><div class="v">${todayTasks}</div><div class="s">${overdue} atrasadas</div></div>
      <div class="tile"><div class="k">A receber</div><div class="v">${typeof money==='function'?money(totalRec):'R$ 0,00'}</div><div class="s">${receivables.length} contas abertas</div></div>
      <div class="tile"><div class="k">Estoque</div><div class="v">${critical}</div><div class="s">itens em atenção</div></div>`;
    const first=app.firstElementChild; if(first)first.insertAdjacentElement('afterend',el);
  }
  function v59AddOrdersSummary(){
    const app=document.getElementById('app');if(!app||document.getElementById('v59OrdersSummary'))return;
    const list=state.orders||[];const open=list.filter(o=>!['Concluído','Entregue','Cancelado'].includes(o.status));
    const delivery=(state.deliveries||[]).filter(d=>d.status!=='Entregue'&&d.status!=='Cancelada').length;
    const reserved=(state.coffees||[]).reduce((s,c)=>s+Number(c.reserved_grams||0),0);
    const el=document.createElement('div');el.id='v59OrdersSummary';el.className='v59-op';
    el.innerHTML=`<div class="v59-op-title"><strong>🔗 Operação conectada</strong><span>Pedidos, entregas, estoque e financeiro</span></div>
      <div class="v59-flow"><span>👥 Clientes</span><span>→</span><span>📦 ${list.length} pedidos</span><span>→</span><span>🚚 ${delivery} entregas</span><span>→</span><span>☕ ${typeof coffee==='function'?coffee(reserved):reserved+' g'} reservados</span></div>
      <div class="v59-action-row"><span class="v59-badge-sync"><i class="v59-dot"></i> Dados sincronizados</span><button class="secondary" onclick="go('calendar')">Ver calendário</button><button class="secondary" onclick="go('finance')">Ver financeiro</button></div>`;
    const first=app.firstElementChild;if(first)first.insertAdjacentElement('afterend',el);
  }
  function v59WrapRender(){if(typeof originalRenderApp==='function')originalRenderApp();v59PostRender()}
  window.renderApp=v59WrapRender;

  async function v59CompleteDelivery(id){
    if(!id)return;
    if(!confirm('Confirmar esta entrega como concluída?'))return;
    const r=await sb.rpc('complete_delivery',{p_delivery_id:id});
    if(r.error){alert(r.error.message);return}
    await loadAll();renderApp();toast('Entrega concluída e operação atualizada.');
  }
  async function v59PayReceivable(id){
    const r0=(state.receivables||[]).find(x=>x.id===id);if(!r0)return;
    const remaining=Math.max(0,Number(r0.amount||0)-Number(r0.paid_amount||0));
    const v=prompt(`Valor recebido (em aberto: ${money(remaining)}):`,String(remaining));
    if(v===null)return;const amount=Number(String(v).replace(',','.'));if(!isFinite(amount)||amount<=0)return;
    const r=await sb.rpc('pay_receivable',{p_receivable_id:id,p_amount:amount});
    if(r.error){alert(r.error.message);return}
    await loadAll();renderApp();toast('Pagamento registrado e pedido atualizado.');
  }
  async function v59CancelOrder(id){
    const o=(state.orders||[]).find(x=>x.id===id);if(!o)return;
    if(!confirm(`Cancelar o pedido de ${o.customer}?\\nO sistema cancelará entrega, calendário, tarefa e recebível relacionados.`))return;
    const r=await sb.rpc('cancel_order_bundle',{p_order_id:id});
    if(r.error){alert(r.error.message);return}
    await loadAll();renderApp();toast('Pedido cancelado e vínculos atualizados.');
  }

  window.v59CompleteDelivery=v59CompleteDelivery;
  window.v59PayReceivable=v59PayReceivable;
  window.v59CancelOrder=v59CancelOrder;

  if(typeof originalOrderDetail==='function'){
    window.orderDetail=function(id){
      originalOrderDetail(id);
      setTimeout(()=>{
        const modalBox=document.querySelector('.modalback:last-child .modalbox');if(!modalBox)return;
        const o=(state.orders||[]).find(x=>x.id===id);if(!o)return;
        const d=(state.deliveries||[]).find(x=>x.order_id===id);
        const rec=(state.receivables||[]).find(x=>x.order_id===id);
        const bar=document.createElement('div');bar.className='v59-op';bar.innerHTML=`
          <div class="v59-op-title"><strong>⚙️ Ações da operação</strong><span>Atualize tudo pelo mesmo pedido</span></div>
          <div class="v59-action-row">
            ${d&&d.status!=='Entregue'&&d.status!=='Cancelada'?`<button class="primary" onclick="v59CompleteDelivery('${d.id}')">✓ Marcar entregue</button>`:''}
            ${rec&&rec.status!=='Pago'&&rec.status!=='Cancelado'?`<button class="secondary" onclick="v59PayReceivable('${rec.id}')">💳 Registrar pagamento</button>`:''}
            ${!['Cancelado','Entregue'].includes(o.status)?`<button class="dangerbtn" onclick="v59CancelOrder('${o.id}')">Cancelar pedido</button>`:''}
          </div>`;
        const target=modalBox.querySelector('.toolbar')||modalBox.lastElementChild; if(target)target.before(bar); else modalBox.appendChild(bar);
      },0);
    }
  }

  // Context in PADIM: send concise screen context.
  const originalCtx=window.v51ContextForPadim;
  window.v51ContextForPadim=function(){
    const ctx=typeof originalCtx==='function'?originalCtx():{};
    ctx.page=state.page;ctx.user_role=typeof role==='function'?role():null;
    if(state.page==='orders')ctx.orders_summary=(state.orders||[]).slice(-8).map(o=>({id:o.id,customer:o.customer,status:o.status,total:o.total,date:o.date,delivery_required:o.delivery_required,delivery_status:o.delivery_status}));
    return ctx;
  };

  // A more useful customer health hint as a small strip when customer page is open.
  const originalCustomers=window.customers;
  if(typeof originalCustomers==='function'){
    window.customers=function(){
      const base=originalCustomers();
      if(!base||!state.customers)return base;
      return base;
    }
  }

  // Make the mobile Activity menu and quick-create truly auth-only even when boot errors.
  if(typeof v52SetAuthChrome==='function') {
    const originalAuthChrome=v52SetAuthChrome;
    window.v52SetAuthChrome=function(on){originalAuthChrome(on);document.body.classList.toggle('crm-ready',!!on)}
  }
})();
</script></body></html>
