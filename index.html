<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CAFÉ DO PADRIM">
<link rel="manifest" href="manifest.webmanifest">
<title>CAFÉ DO PADRIM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f2ed;--card:#fff;--ink:#2d241f;--muted:#756b64;--brand:#6b4226;--line:#e4d9d0;--ok:#2e7d32;--danger:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f6f2ed,#eaded3)}
.authcard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 40px #0002}.logo{text-align:center;font-size:48px}.authcard h1{text-align:center;margin:7px 0}.sub{text-align:center;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:15px 0 6px}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.primary{background:var(--brand);color:#fff;padding:11px 15px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.fullbtn{width:100%;margin-top:16px}.secondary{background:#eee5de;color:var(--ink);padding:10px 14px;border:0;border-radius:9px;cursor:pointer}.linkbtn{display:block;margin:15px auto 0;border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer}.msg{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px}.msg.error{display:block;background:#fde7e5;color:var(--danger)}.msg.ok{display:block;background:#e6f4e7;color:var(--ok)}.hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin-top:14px}
.app{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#2e2119;color:#fff;padding:20px;z-index:10}.brand{font-weight:900;font-size:20px;margin-bottom:22px}.nav button{width:100%;display:block;text-align:left;background:transparent;color:#ddd;border:0;padding:11px;border-radius:9px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#4b3527;color:#fff}.userbox{border-top:1px solid #5a4638;margin-top:18px;padding-top:15px;font-size:12px}.useremail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:9px}.main{margin-left:245px;width:calc(100% - 245px);padding:22px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.metric{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee5de;font-size:12px}.ok{background:#e6f4e7;color:var(--ok)}.danger{background:#fde7e5;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:25px}.search{display:flex;gap:10px;margin-bottom:13px}.search .input{flex:1}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#f1ebe5;border-radius:12px;padding:10px;min-height:230px}.lead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.lead strong{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.profileHero{display:flex;align-items:center;gap:15px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.avatar{width:58px;height:58px;border-radius:50%;background:#6b4226;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}.profileEmail{font-size:14px;color:var(--muted)}.profileActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.mobilebar{display:none}
@media(max-width:900px){.side{display:none}.main{margin-left:0;width:100%;padding:14px 14px 80px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.kanban{grid-template-columns:1fr 1fr}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#2e2119;z-index:20;justify-content:space-around;padding:7px}.mobilebar button{background:transparent;color:#fff;border:0;font-size:11px}.top h1{font-size:21px}.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){.kanban{grid-template-columns:1fr}.cards{gap:8px}.card{padding:12px}.metric{font-size:20px}}

.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:7px}.calday{min-height:120px;background:#f8f4f0;border:1px solid var(--line);border-radius:10px;padding:7px;overflow:hidden}.emptyday{background:transparent;border:0}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.caladd{border:0;background:#eaded3;color:var(--brand);border-radius:6px;width:24px;height:24px;cursor:pointer;font-weight:800}.calevent{display:flex;justify-content:space-between;gap:4px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px;margin:4px 0;font-size:11px}.calevent span{cursor:pointer;flex:1}.calevent.done{opacity:.55;text-decoration:line-through}.calevent button{border:0;background:none;color:var(--danger);cursor:pointer;font-size:15px;line-height:1}.tablewrap{overflow:auto}
@media(max-width:900px){.calendarGrid{grid-template-columns:repeat(7,minmax(90px,1fr));overflow-x:auto}.calday{min-height:105px}.section:has(.calendarGrid){overflow:auto}}
.bars{display:flex;align-items:flex-end;gap:16px;height:210px;padding:20px 10px 0}.baritem{flex:1;text-align:center;min-width:55px}.bar{height:160px;display:flex;align-items:flex-end;justify-content:center}.bar span{display:block;width:65%;background:var(--brand);border-radius:7px 7px 0 0}.barvalue{font-size:11px;color:var(--muted);height:28px;overflow:hidden}.barlabel{font-size:12px;margin-top:6px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://dpayeuceopjbgqvogvuq.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable__XFoteYjmoTsY77Prw3kwg_Yze3b2z1';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('COLOQUE_AQUI')&&!SUPABASE_ANON_KEY.includes('COLOQUE_AQUI');
const sb=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

const state={page:'dashboard',user:null,profile:null,customers:[],leads:[],products:[],orders:[],tasks:[],commissions:[],calendar:[],coffees:[],suppliers:[],movements:[],expenses:[],calendarMonth:new Date().getMonth()+1,calendarYear:new Date().getFullYear()};
const menus=[['dashboard','📊 Dashboard'],['leads','🎯 Leads'],['orders','📦 Pedidos'],['coffees','☕ Cafés'],['suppliers','🚜 Fornecedores'],['inventory','📦 Estoque'],['products','🛍️ Produtos'],['tasks','✅ Tarefas'],['finance','💰 Financeiro'],['commission','💵 Comissão'],['calendar','📅 Calendário'],['profile','👤 Perfil']];

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0)}
function grams(v){return Math.max(0,Number(v)||0)}
function coffee(v){const g=grams(v); if(g>=1000){const kg=g/1000; return `${Number.isInteger(kg)?kg:kg.toLocaleString('pt-BR',{maximumFractionDigits:2})} kg (${g.toLocaleString('pt-BR')} g)`} return `${g.toLocaleString('pt-BR')} g`}
function parseCoffee(value,unit){const n=Number(String(value).replace(',','.'))||0; return unit==='kg'?n*1000:n}
function msg(el,text,ok=false){el.textContent=text;el.className='msg '+(ok?'ok':'error');el.style.display='block'}
function go(p){state.page=p;renderApp()}
function initials(email){return (email||'?').trim().slice(0,1).toUpperCase()}
function authScreen(mode='login'){
 document.getElementById('root').innerHTML=`<div class="auth"><section class="authcard">
 <div class="logo">☕</div><h1>CAFÉ DO PADRIM</h1>
 <p class="sub">${mode==='signup'?'Crie seu perfil':'Entre no seu perfil'}</p>
 <label>E-mail (seu Gmail ou outro e-mail)</label><input class="input" id="authEmail" type="email" autocomplete="email" placeholder="seunome@gmail.com">
 <label>Senha</label><input class="input" id="authPass" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="Crie ou digite sua senha">
 ${mode==='signup'?'<label>Confirmar senha</label><input class="input" id="authPass2" type="password" autocomplete="new-password" placeholder="Repita sua senha">':''}
 <button class="primary fullbtn" onclick="submitAuth('${mode}')">${mode==='signup'?'CRIAR PERFIL':'ENTRAR'}</button>
 <button class="linkbtn" onclick="authScreen('${mode==='signup'?'login':'signup'}')">${mode==='signup'?'Já tenho um perfil':'Criar novo perfil'}</button>
 ${mode==='login'?'<button class="linkbtn" onclick="forgotPassword()">Esqueci minha senha</button>':''}
 <div id="authMsg" class="msg"></div>
 <div class="hint">Cada perfil usa um e-mail e uma senha próprios. O e-mail pode ser o Gmail da pessoa. A senha é criada pela própria pessoa e pode conter letras, números e símbolos.</div>
 </section></div>`;
}
async function submitAuth(mode){
 const email=document.getElementById('authEmail').value.trim();
 const pass=document.getElementById('authPass').value;
 const m=document.getElementById('authMsg');
 if(!email||!email.includes('@'))return msg(m,'Digite um e-mail válido.');
 if(!pass)return msg(m,'Digite uma senha.');
 if(mode==='signup'&&pass!==document.getElementById('authPass2').value)return msg(m,'As senhas não conferem.');
 try{
   const r=mode==='signup'?await sb.auth.signUp({email,password:pass}):await sb.auth.signInWithPassword({email,password:pass});
   if(r.error)throw r.error;
   if(mode==='signup'&&!r.data.session){
     msg(m,'Perfil criado! Confira o Gmail para confirmar o endereço e depois entre no CAFÉ DO PADRIM.',true);
     return;
   }
   await start(r.data.user);
 }catch(e){msg(m,e.message||'Não foi possível concluir o acesso.')}
}
async function forgotPassword(){
 const email=prompt('Digite o e-mail do perfil para receber o link de recuperação:');
 if(!email)return;
 const r=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});
 if(r.error)alert(r.error.message);else alert('Enviamos as instruções de recuperação para o e-mail informado.');
}
async function start(user){state.user=user;await loadProfile();await loadAll();renderApp()}
async function loadProfile(){
 const r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();
 state.profile=r.data||{id:state.user.id,email:state.user.email};
}
async function loadAll(){
 for(const t of ['leads','products','orders','tasks','commissions','calendar','coffees','suppliers','movements','expenses']){
  const r=await sb.from(t).select('*').order('created_at',{ascending:true});
  state[t]=r.error?[]:(r.data||[]);
 }
 await ensureTaskCalendars();
}
async function insert(t,row){
 const r=await sb.from(t).insert({...row,user_id:state.user.id}).select().single();
 if(r.error)throw r.error;return r.data;
}
async function update(t,id,row){
 const r=await sb.from(t).update(row).eq('id',id);if(r.error)throw r.error;
}
async function logout(){await sb.auth.signOut();state.user=null;state.profile=null;authScreen('login')}

function shell(){
 document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand">☕ CAFÉ DO PADRIM</div><div class="nav" id="nav"></div><div class="userbox" id="userbox"></div></aside><main class="main" id="app"></main><div class="mobilebar" id="mobilebar"></div></div>`;
}
function layout(){
 document.getElementById('nav').innerHTML=menus.map(([k,t])=>`<button class="${state.page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');
 document.getElementById('mobilebar').innerHTML=menus.map(([k,t])=>`<button onclick="go('${k}')">${t.split(' ')[0]}<br>${t.replace(/^[^ ]+ /,'')}</button>`).join('');
 document.getElementById('userbox').innerHTML=`<div class="useremail">${esc(state.user.email)}</div><button class="secondary" style="width:100%" onclick="go('profile')">Abrir PERFIL</button>`;
}
function modal(title,body,save){
 const x=document.createElement('div');x.style.cssText='position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:15px';
 x.innerHTML=`<div class="section" style="width:min(600px,100%);max-height:90vh;overflow:auto"><div class="top"><h2>${title}</h2><button class="secondary" onclick="this.closest('[data-modal]').remove()">Fechar</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="secondary" onclick="this.closest('[data-modal]').remove()">Cancelar</button><button class="primary" id="save">Salvar</button></div></div>`;
 x.dataset.modal='1';document.body.appendChild(x);x.querySelector('#save').onclick=async()=>{try{if(await save(x))x.remove()}catch(e){alert(e.message||'Erro ao salvar')}};
}
function monthKey(date){return String(date||'').slice(0,7)}
function dashboard(){
 const done=state.orders.filter(o=>o.status==='Concluído');
 const revenue=done.reduce((s,o)=>s+Number(o.total||0),0);
 const coffeeTotal=done.reduce((s,o)=>s+Number(o.coffee_grams||0),0);
 const commissionTotal=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0);
 const expenses=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 const result=revenue-commissionTotal-expenses;
 const stock=state.coffees.reduce((s,c)=>s+Number(c.stock_grams||0),0);
 const low=state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0));
 const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);const k=d.toISOString().slice(0,7);return {k,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),value:done.filter(o=>monthKey(o.date)===k).reduce((s,o)=>s+Number(o.total||0),0)}});
 const max=Math.max(...months.map(m=>m.value),1);
 return `<div class="top"><div><h1>Dashboard</h1><div class="muted">Visão geral da operação do CAFÉ DO PADRIM</div></div></div>
 <div class="cards"><div class="card"><div class="muted">Faturamento concluído</div><div class="metric">${money(revenue)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(result)}</div></div><div class="card"><div class="muted">Café vendido</div><div class="metric">${coffee(coffeeTotal)}</div></div><div class="card"><div class="muted">Estoque atual</div><div class="metric">${coffee(stock)}</div></div></div>
 <div class="grid"><div class="section"><h2>Faturamento — últimos 6 meses</h2><div class="bars">${months.map(m=>`<div class="baritem"><div class="barvalue">${money(m.value)}</div><div class="bar"><span style="height:${Math.max(4,(m.value/max)*150)}px"></span></div><div class="barlabel">${esc(m.label)}</div></div>`).join('')}</div></div><div class="section"><h2>Alertas de estoque</h2>${low.length?low.map(c=>`<div class="lead"><strong>${esc(c.name)}</strong><span class="badge danger">${coffee(c.stock_grams)} em estoque</span></div>`).join(''):'<div class="empty">Estoque saudável. Nenhum alerta.</div>'}</div></div>
 <div class="grid"><div class="section"><h2>Últimos pedidos</h2>${state.orders.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Data</th><th>Café</th><th>Valor</th><th>Status</th></tr>${state.orders.slice().reverse().slice(0,8).map(o=>`<tr><td>${esc(o.customer)}</td><td>${esc(o.date)}</td><td>${coffee(o.coffee_grams)}</td><td>${money(o.total)}</td><td><span class="badge ${o.status==='Concluído'?'ok':o.status==='Cancelado'?'danger':''}">${esc(o.status)}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum pedido.</div>'}</div><div class="section"><h2>Próximas obrigações</h2>${state.calendar.filter(e=>!e.completed && e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="lead"><strong>${esc(e.title)}</strong><span class="muted">${new Date(e.date+'T12:00:00').toLocaleDateString('pt-BR')} · ${esc(e.type||'Obrigação')}</span></div>`).join('')||'<div class="empty">Nenhuma obrigação próxima.</div>'}</div></div>`;
}
function leads(){const s=['Novo Lead','Contato realizado','Interesse identificado','Proposta enviada','Negociação','Venda realizada'];return `<div class="top"><div><h1>Leads & Pipeline</h1><div class="muted">Oportunidades comerciais e pedidos de café</div></div><button class="primary" onclick="newLead()">+ Novo lead</button></div><div class="kanban">${s.map(st=>`<div class="col"><h3>${st}</h3>${state.leads.filter(l=>l.stage===st).map(l=>`<div class="lead"><strong>${esc(l.name)}</strong><span class="muted">Potencial: ${money(l.value)}</span><br><span class="muted">Café: ${coffee(l.coffee_grams)}</span><br><span class="badge ${l.delivered?'ok':''}">${l.delivered?'Entregue':'Pendente'}</span><br><button class="secondary" style="margin-top:7px" onclick="advance('${l.id}')">Avançar →</button> ${!l.delivered?`<button class="primary" style="margin-top:7px" onclick="deliverLead('${l.id}')">Entregar</button>`:''}</div>`).join('')||'<div class="muted" style="padding:10px">Vazio</div>'}</div>`).join('')}</div>`}
function newLead(){modal('Novo lead',`<label>Nome</label><input class="input" id="name"><label>Valor potencial</label><input class="input" id="value" type="number" step="0.01"><div class="formgrid"><div><label>Quantidade de café</label><input class="input" id="coffeeQty" type="number" min="0" step="0.01" placeholder="Ex.: 1"></div><div><label>Unidade</label><select class="input" id="coffeeUnit"><option value="g">gramas (g)</option><option value="kg">quilogramas (kg)</option></select></div></div>`,async x=>{const name=x.querySelector('#name').value.trim();if(!name)return false;const r=await insert('leads',{name,value:Number(x.querySelector('#value').value)||0,stage:'Novo Lead',coffee_grams:parseCoffee(x.querySelector('#coffeeQty').value,x.querySelector('#coffeeUnit').value),delivered:false});state.leads.push(r);renderApp();return true})}
async function advance(id){const s=['Novo Lead','Contato realizado','Interesse identificado','Proposta enviada','Negociação','Venda realizada'];const l=state.leads.find(x=>x.id===id),i=s.indexOf(l.stage);if(i<s.length-1){l.stage=s[i+1];await update('leads',id,{stage:l.stage});renderApp()}}
async function deliverLead(id){const l=state.leads.find(x=>x.id===id);if(!l)return;const value=prompt(`Valor da venda para ${l.name} (${coffee(l.coffee_grams)}):`);if(value===null)return;const total=Number(String(value).replace(',','.'));if(!Number.isFinite(total)||total<0)return alert('Digite um valor de venda válido.');try{const order=await insert('orders',{customer:l.name,total,coffee_grams:grams(l.coffee_grams),status:'Concluído',date:new Date().toISOString().slice(0,10)});l.delivered=true;l.sale_value=total;l.delivered_at=new Date().toISOString();await update('leads',id,{delivered:true,sale_value:total,delivered_at:l.delivered_at,stage:'Venda realizada'});state.orders.push(order);renderApp();alert('Entrega registrada e valor lançado no Dashboard!')}catch(e){alert(e.message||'Não foi possível registrar a entrega.')}}

function coffeeForm(c={}){return `<div class="formgrid"><div><label>Nome do café</label><input class="input" id="name" value="${esc(c.name||'')}" placeholder="Ex.: Especial Cerrado"></div><div><label>Fornecedor</label><select class="input" id="supplier">${'<option value="">Sem fornecedor</option>'+state.suppliers.map(x=>`<option value="${x.id}" ${c.supplier_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Origem</label><input class="input" id="origin" value="${esc(c.origin||'')}" placeholder="Ex.: Cerrado Mineiro"></div><div><label>Produtor</label><input class="input" id="producer" value="${esc(c.producer||'')}"></div><div><label>Torra</label><select class="input" id="roast"><option>Clara</option><option ${c.roast==='Média'?'selected':''}>Média</option><option ${c.roast==='Escura'?'selected':''}>Escura</option></select></div><div><label>Processo</label><input class="input" id="process" value="${esc(c.process||'')}" placeholder="Natural, lavado..."></div><div><label>Custo por kg (R$)</label><input class="input" id="cost" type="number" step="0.01" value="${Number(c.cost_per_kg||0)}"></div><div><label>Preço de venda por kg (R$)</label><input class="input" id="sale" type="number" step="0.01" value="${Number(c.sale_per_kg||0)}"></div><div><label>Estoque atual (g)</label><input class="input" id="stock" type="number" min="0" step="1" value="${Number(c.stock_grams||0)}"></div><div><label>Estoque mínimo (g)</label><input class="input" id="min" type="number" min="0" step="1" value="${Number(c.min_stock_grams||0)}"></div><div class="full"><label>Foto do café (URL opcional)</label><input class="input" id="photo" value="${esc(c.photo_url||'')}" placeholder="https://..."></div></div>`}
function coffees(){return `<div class="top"><div><h1>Cafés</h1><div class="muted">Tipos, origem, fornecedor, preço e estoque</div></div><button class="primary" onclick="newCoffee()">+ Novo café</button></div><div class="section">${state.coffees.length?`<div class="tablewrap"><table><tr><th>Café</th><th>Origem</th><th>Fornecedor</th><th>Custo/kg</th><th>Venda/kg</th><th>Estoque</th><th>Ações</th></tr>${state.coffees.map(c=>`<tr><td><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.roast||'')} · ${esc(c.process||'')}</span></td><td>${esc(c.origin||'-')}</td><td>${esc(state.suppliers.find(s=>s.id===c.supplier_id)?.name||'-')}</td><td>${money(c.cost_per_kg)}</td><td>${money(c.sale_per_kg)}</td><td><span class="badge ${Number(c.stock_grams||0)<=Number(c.min_stock_grams||0)?'danger':'ok'}">${coffee(c.stock_grams)}</span></td><td><button class="secondary" onclick="editCoffee('${c.id}')">Editar</button> <button class="secondary" onclick="deleteCoffee('${c.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Cadastre seu primeiro tipo de café.</div>'}</div>`}
function newCoffee(){modal('Novo café',coffeeForm(),async x=>{const name=x.querySelector('#name').value.trim();if(!name)return false;const row={name,supplier_id:x.querySelector('#supplier').value||null,origin:x.querySelector('#origin').value.trim(),producer:x.querySelector('#producer').value.trim(),roast:x.querySelector('#roast').value,process:x.querySelector('#process').value.trim(),cost_per_kg:Number(x.querySelector('#cost').value)||0,sale_per_kg:Number(x.querySelector('#sale').value)||0,stock_grams:Number(x.querySelector('#stock').value)||0,min_stock_grams:Number(x.querySelector('#min').value)||0,photo_url:x.querySelector('#photo').value.trim()||null};const r=await insert('coffees',row);state.coffees.push(r);renderApp();return true})}
function editCoffee(id){const c=state.coffees.find(x=>x.id===id);if(!c)return;modal('Editar café',coffeeForm(c),async x=>{const row={name:x.querySelector('#name').value.trim(),supplier_id:x.querySelector('#supplier').value||null,origin:x.querySelector('#origin').value.trim(),producer:x.querySelector('#producer').value.trim(),roast:x.querySelector('#roast').value,process:x.querySelector('#process').value.trim(),cost_per_kg:Number(x.querySelector('#cost').value)||0,sale_per_kg:Number(x.querySelector('#sale').value)||0,stock_grams:Number(x.querySelector('#stock').value)||0,min_stock_grams:Number(x.querySelector('#min').value)||0,photo_url:x.querySelector('#photo').value.trim()||null};if(!row.name)return false;await update('coffees',id,row);Object.assign(c,row);renderApp();return true})}
async function deleteCoffee(id){const c=state.coffees.find(x=>x.id===id);if(!c||!confirm(`Apagar o café ${c.name}?`))return;const r=await sb.from('coffees').delete().eq('id',id);if(r.error)return alert(r.error.message);state.coffees=state.coffees.filter(x=>x.id!==id);renderApp()}
function suppliers(){return `<div class="top"><div><h1>Fornecedores</h1><div class="muted">Parceiros e origem dos cafés</div></div><button class="primary" onclick="newSupplier()">+ Fornecedor</button></div><div class="section">${state.suppliers.length?`<div class="tablewrap"><table><tr><th>Nome</th><th>Contato</th><th>Cidade</th><th>Cafés vinculados</th><th>Ações</th></tr>${state.suppliers.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.phone||s.email||'-')}</td><td>${esc(s.city||'-')}</td><td>${state.coffees.filter(c=>c.supplier_id===s.id).map(c=>esc(c.name)).join(', ')||'-'}</td><td><button class="secondary" onclick="editSupplier('${s.id}')">Editar</button> <button class="secondary" onclick="deleteSupplier('${s.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum fornecedor cadastrado.</div>'}</div>`}
function supplierForm(s={}){return `<label>Nome</label><input class="input" id="name" value="${esc(s.name||'')}" placeholder="Nome do fornecedor"><div class="formgrid"><div><label>Telefone</label><input class="input" id="phone" value="${esc(s.phone||'')}"></div><div><label>E-mail</label><input class="input" id="email" type="email" value="${esc(s.email||'')}"></div></div><label>Cidade/UF</label><input class="input" id="city" value="${esc(s.city||'')}"><label>Observações</label><textarea class="input" id="notes" rows="3">${esc(s.notes||'')}</textarea>`}
function newSupplier(){modal('Novo fornecedor',supplierForm(),async x=>{const name=x.querySelector('#name').value.trim();if(!name)return false;const r=await insert('suppliers',{name,phone:x.querySelector('#phone').value.trim(),email:x.querySelector('#email').value.trim(),city:x.querySelector('#city').value.trim(),notes:x.querySelector('#notes').value.trim()});state.suppliers.push(r);renderApp();return true})}
function editSupplier(id){const s=state.suppliers.find(x=>x.id===id);if(!s)return;modal('Editar fornecedor',supplierForm(s),async x=>{const row={name:x.querySelector('#name').value.trim(),phone:x.querySelector('#phone').value.trim(),email:x.querySelector('#email').value.trim(),city:x.querySelector('#city').value.trim(),notes:x.querySelector('#notes').value.trim()};if(!row.name)return false;await update('suppliers',id,row);Object.assign(s,row);renderApp();return true})}
async function deleteSupplier(id){const s=state.suppliers.find(x=>x.id===id);if(!s||!confirm(`Apagar o fornecedor ${s.name}?`))return;if(state.coffees.some(c=>c.supplier_id===id))return alert('Este fornecedor está vinculado a um café. Remova o vínculo primeiro.');const r=await sb.from('suppliers').delete().eq('id',id);if(r.error)return alert(r.error.message);state.suppliers=state.suppliers.filter(x=>x.id!==id);renderApp()}
function inventory(){const sorted=state.movements.slice().reverse();return `<div class="top"><div><h1>Estoque</h1><div class="muted">Entradas, saídas e histórico por tipo de café</div></div><button class="primary" onclick="newMovement()">+ Movimentação</button></div><div class="section"><h2>Saldo atual</h2><div class="cards" style="margin-top:12px">${state.coffees.map(c=>`<div class="card"><strong>${esc(c.name)}</strong><div class="metric">${coffee(c.stock_grams)}</div><span class="badge ${Number(c.stock_grams)<=Number(c.min_stock_grams)?'danger':'ok'}">mínimo ${coffee(c.min_stock_grams)}</span></div>`).join('')||'<div class="empty">Cadastre cafés para controlar estoque.</div>'}</div></div><div class="section" style="margin-top:14px"><h2>Histórico</h2>${sorted.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Café</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>${sorted.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(state.coffees.find(c=>c.id===m.coffee_id)?.name||'-')}</td><td><span class="badge ${m.type==='Entrada'?'ok':'danger'}">${esc(m.type)}</span></td><td>${coffee(m.grams)}</td><td>${esc(m.reason||'-')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma movimentação.</div>'}</div>`}
function newMovement(){if(!state.coffees.length)return alert('Cadastre um café antes de movimentar o estoque.');modal('Nova movimentação',`<label>Café</label><select class="input" id="coffee">${state.coffees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Tipo</label><select class="input" id="type"><option>Entrada</option><option>Saída</option></select></div><div><label>Quantidade (g)</label><input class="input" id="grams" type="number" min="1" step="1"></div><div><label>Data</label><input class="input" id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Motivo</label><input class="input" id="reason" placeholder="Compra, venda, perda..."></div></div>`,async x=>{const id=x.querySelector('#coffee').value,type=x.querySelector('#type').value,g=Number(x.querySelector('#grams').value)||0,c=state.coffees.find(z=>z.id===id);if(!c||g<=0)return false;if(type==='Saída'&&g>Number(c.stock_grams||0))return alert('Quantidade maior que o estoque disponível.');const movement=await insert('inventory_movements',{coffee_id:id,type,grams:g,date:x.querySelector('#date').value,reason:x.querySelector('#reason').value.trim()});const newStock=Number(c.stock_grams||0)+(type==='Entrada'?g:-g);await update('coffees',id,{stock_grams:newStock});c.stock_grams=newStock;state.movements.push(movement);renderApp();return true})}
function finance(){const revenue=state.orders.filter(o=>o.status==='Concluído').reduce((s,o)=>s+Number(o.total||0),0),expenses=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),comm=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0),result=revenue-expenses-comm;return `<div class="top"><div><h1>Financeiro</h1><div class="muted">Receitas, despesas, comissões e resultado estimado</div></div><button class="primary" onclick="newExpense()">+ Despesa</button></div><div class="cards"><div class="card"><div class="muted">Receita</div><div class="metric">${money(revenue)}</div></div><div class="card"><div class="muted">Despesas</div><div class="metric">${money(expenses)}</div></div><div class="card"><div class="muted">Comissões</div><div class="metric">${money(comm)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(result)}</div></div></div><div class="section" style="margin-top:14px"><h2>Despesas cadastradas</h2>${state.expenses.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Ação</th></tr>${state.expenses.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category||'-')}</td><td>${money(e.amount)}</td><td><button class="secondary" onclick="deleteExpense('${e.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma despesa cadastrada.</div>'}</div>`}
function newExpense(){modal('Nova despesa',`<label>Descrição</label><input class="input" id="description" placeholder="Ex.: Frete de café"><div class="formgrid"><div><label>Categoria</label><select class="input" id="category"><option>Compra de café</option><option>Frete</option><option>Embalagem</option><option>Operacional</option><option>Marketing</option><option>Outro</option></select></div><div><label>Valor (R$)</label><input class="input" id="amount" type="number" min="0" step="0.01"></div><div><label>Data</label><input class="input" id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>`,async x=>{const description=x.querySelector('#description').value.trim(),amount=Number(x.querySelector('#amount').value)||0;if(!description||amount<=0)return false;const r=await insert('expenses',{description,category:x.querySelector('#category').value,amount,date:x.querySelector('#date').value});state.expenses.push(r);renderApp();return true})}
async function deleteExpense(id){if(!confirm('Apagar esta despesa?'))return;const r=await sb.from('expenses').delete().eq('id',id);if(r.error)return alert(r.error.message);state.expenses=state.expenses.filter(x=>x.id!==id);renderApp()}
function products(){return `<div class="top"><div><h1>Produtos</h1><div class="muted">Catálogo</div></div><button class="primary" onclick="newProduct()">+ Produto</button></div><div class="section">${state.products.length?`<table><tr><th>Produto</th><th>Preço</th><th>Custo</th><th>Estoque</th></tr>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhum produto.</div>'}</div>`}
function newProduct(){modal('Novo produto',`<label>Nome</label><input class="input" id="name"><label>Preço</label><input class="input" id="price" type="number" step="0.01"><label>Custo</label><input class="input" id="cost" type="number" step="0.01"><label>Estoque</label><input class="input" id="stock" type="number">`,async x=>{const name=x.querySelector('#name').value.trim();if(!name)return false;const r=await insert('products',{name,price:Number(x.querySelector('#price').value)||0,cost:Number(x.querySelector('#cost').value)||0,stock:Number(x.querySelector('#stock').value)||0});state.products.push(r);renderApp();return true})}
function orders(){return `<div class="top"><div><h1>Pedidos</h1><div class="muted">Histórico de vendas — altere status, quantidade e apague pedidos</div></div><button class="primary" onclick="newOrder()">+ Pedido</button></div><div class="section">${state.orders.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Data</th><th>Total de café</th><th>Valor</th><th>Status</th><th>Ações</th></tr>${state.orders.slice().reverse().map(o=>`<tr><td>${esc(o.customer)}</td><td>${esc(o.date)}</td><td>${coffee(o.coffee_grams)}</td><td>${money(o.total)}</td><td><span class="badge ${o.status==='Concluído'?'ok':o.status==='Cancelado'?'danger':''}">${esc(o.status)}</span></td><td><button class="secondary" onclick="editOrder('${o.id}')">Status/Editar</button> <button class="secondary" onclick="deleteOrder('${o.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum pedido.</div>'}</div>`}
function orderForm(o={}){return `<div class="formgrid"><div><label>Cliente</label><input class="input" id="customer" value="${esc(o.customer||'')}"></div><div><label>Data</label><input class="input" id="date" type="date" value="${esc(o.date||new Date().toISOString().slice(0,10))}"></div><div><label>Quantidade de café</label><input class="input" id="coffeeQty" type="number" min="0" step="0.01" value="${o.coffee_grams>=1000?(o.coffee_grams/1000):o.coffee_grams}"></div><div><label>Unidade</label><select class="input" id="coffeeUnit"><option value="g" ${o.coffee_grams<1000?'selected':''}>gramas (g)</option><option value="kg" ${o.coffee_grams>=1000?'selected':''}>quilogramas (kg)</option></select></div><div><label>Valor da venda</label><input class="input" id="total" type="number" step="0.01" min="0" value="${Number(o.total||0)}"></div><div><label>Status</label><select class="input" id="status"><option ${o.status==='Novo'?'selected':''}>Novo</option><option ${o.status==='Confirmado'?'selected':''}>Confirmado</option><option ${o.status==='Entregue'?'selected':''}>Entregue</option><option ${o.status==='Concluído'?'selected':''}>Concluído</option><option ${o.status==='Cancelado'?'selected':''}>Cancelado</option></select></div></div>`}
function newOrder(){modal('Novo pedido',orderForm(),async x=>{const customer=x.querySelector('#customer').value.trim();if(!customer)return false;const r=await insert('orders',{customer,total:Number(x.querySelector('#total').value)||0,coffee_grams:parseCoffee(x.querySelector('#coffeeQty').value,x.querySelector('#coffeeUnit').value),status:x.querySelector('#status').value,date:x.querySelector('#date').value});state.orders.push(r);renderApp();return true})}
function editOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;modal('Editar pedido',orderForm(o),async x=>{const row={customer:x.querySelector('#customer').value.trim(),total:Number(x.querySelector('#total').value)||0,coffee_grams:parseCoffee(x.querySelector('#coffeeQty').value,x.querySelector('#coffeeUnit').value),status:x.querySelector('#status').value,date:x.querySelector('#date').value};if(!row.customer)return false;await update('orders',id,row);Object.assign(o,row);renderApp();return true})}
async function deleteOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;if(!confirm(`Apagar o pedido de ${o.customer}? Essa ação não pode ser desfeita.`))return;try{const r=await sb.from('orders').delete().eq('id',id);if(r.error)throw r.error;state.orders=state.orders.filter(x=>x.id!==id);renderApp()}catch(e){alert(e.message||'Não foi possível apagar o pedido.')}}
function tasks(){return `<div class="top"><div><h1>Tarefas</h1><div class="muted">Tarefas com data aparecem automaticamente no Calendário</div></div><button class="primary" onclick="newTask()">+ Tarefa</button></div><div class="section">${state.tasks.map(t=>`<div class="lead"><strong>${esc(t.title)}</strong><span class="muted">${esc(t.date||'Sem data')} · ${esc(t.status)}</span><br><button class="secondary" style="margin-top:7px" onclick="editTask('${t.id}')">Editar</button> <button class="secondary" style="margin-top:7px" onclick="completeTask('${t.id}')">${t.status==='Concluída'?'Concluída':'Concluir'}</button> <button class="secondary" style="margin-top:7px" onclick="deleteTask('${t.id}')">Apagar</button></div>`).join('')||'<div class="empty">Nenhuma tarefa.</div>'}</div>`}
function taskForm(t={}){return `<label>Tarefa</label><input class="input" id="title" value="${esc(t.title||'')}" placeholder="Ex.: Pedir para o Yann fazer café"><label>Data</label><input class="input" id="date" type="date" value="${esc(t.date||'')}"><div class="hint" style="text-align:left">Ao definir uma data, esta tarefa será sincronizada automaticamente com o Calendário.</div>`}
async function ensureTaskCalendars(){
 for(const t of state.tasks){
   if(!t.date)continue;
   const linked=state.calendar.find(e=>e.task_id===t.id);
   if(!linked){
     try{const r=await insert('calendar',{title:t.title,date:t.date,type:'Tarefa',notes:'Sincronizado automaticamente com a aba Tarefas.',completed:t.status==='Concluída',task_id:t.id});state.calendar.push(r)}catch(e){console.warn('Não foi possível sincronizar tarefa com calendário',e)}
   }
 }
}

async function syncTaskCalendar(task, previousDate=null){
 const linked=state.calendar.find(e=>e.task_id===task.id);
 if(task.date){
   const row={title:task.title,date:task.date,type:'Tarefa',notes:'Sincronizado automaticamente com a aba Tarefas.',completed:task.status==='Concluída',task_id:task.id};
   if(linked){await update('calendar',linked.id,row);Object.assign(linked,row)}
   else {const r=await insert('calendar',row);state.calendar.push(r)}
 } else if(linked){const r=await sb.from('calendar').delete().eq('id',linked.id);if(r.error)throw r.error;state.calendar=state.calendar.filter(e=>e.id!==linked.id)}
}
function newTask(){modal('Nova tarefa',taskForm(),async x=>{const title=x.querySelector('#title').value.trim();const date=x.querySelector('#date').value;if(!title)return false;try{const r=await insert('tasks',{title,date:date||null,status:'A fazer'});await syncTaskCalendar(r);state.tasks.push(r);renderApp();return true}catch(e){alert(e.message||'Não foi possível criar a tarefa.');return false}})}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;modal('Editar tarefa',taskForm(t),async x=>{const title=x.querySelector('#title').value.trim();const date=x.querySelector('#date').value;if(!title)return false;try{const row={title,date:date||null};await update('tasks',id,row);Object.assign(t,row);await syncTaskCalendar(t);renderApp();return true}catch(e){alert(e.message||'Não foi possível editar a tarefa.');return false}})}
async function completeTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;try{const status=t.status==='Concluída'?'A fazer':'Concluída';await update('tasks',id,{status});t.status=status;await syncTaskCalendar(t);renderApp()}catch(e){alert(e.message||'Não foi possível atualizar a tarefa.')}}
async function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!confirm(`Apagar a tarefa "${t.title}"? Ela também será removida do Calendário.`))return;try{const linked=state.calendar.find(e=>e.task_id===id);if(linked){const r=await sb.from('calendar').delete().eq('id',linked.id);if(r.error)throw r.error}const r=await sb.from('tasks').delete().eq('id',id);if(r.error)throw r.error;state.tasks=state.tasks.filter(x=>x.id!==id);state.calendar=state.calendar.filter(e=>e.task_id!==id);renderApp()}catch(e){alert(e.message||'Não foi possível apagar a tarefa.')}}

function commission(){
 return `<div class="top"><div><h1>Comissão</h1><div class="muted">Controle das comissões definidas pelo administrador</div></div><button class="primary" onclick="newCommission()">+ Adicionar comissão</button></div>
 <div class="section"><div class="muted" style="margin-bottom:12px">Cadastre o nome da pessoa e o valor da comissão a ser pago. Você pode adicionar, editar e remover registros.</div>${state.commissions.length?`<div class="tablewrap"><table><tr><th>Nome</th><th>Comissão</th><th>Data</th><th>Ações</th></tr>${state.commissions.slice().reverse().map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${money(c.amount)}</td><td>${new Date(c.created_at).toLocaleDateString('pt-BR')}</td><td><button class="secondary" onclick="editCommission('${c.id}')">Editar</button> <button class="secondary" onclick="deleteCommission('${c.id}')">Remover</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma comissão cadastrada.</div>'}</div>`
}
function commissionForm(c={}){return `<label>Nome</label><input class="input" id="name" value="${esc(c.name||'')}" placeholder="Nome do colaborador"><label>Valor da comissão (R$)</label><input class="input" id="amount" type="number" min="0" step="0.01" value="${Number(c.amount||0)}" placeholder="Ex.: 500,00">`}
function newCommission(){modal('Nova comissão',commissionForm(),async x=>{const name=x.querySelector('#name').value.trim();const amount=Number(String(x.querySelector('#amount').value).replace(',','.'));if(!name||!Number.isFinite(amount)||amount<0)return false;const r=await insert('commissions',{name,amount});state.commissions.push(r);renderApp();return true})}
function editCommission(id){const c=state.commissions.find(x=>x.id===id);if(!c)return;modal('Editar comissão',commissionForm(c),async x=>{const row={name:x.querySelector('#name').value.trim(),amount:Number(String(x.querySelector('#amount').value).replace(',','.'))||0};if(!row.name||row.amount<0)return false;await update('commissions',id,row);Object.assign(c,row);renderApp();return true})}
async function deleteCommission(id){const c=state.commissions.find(x=>x.id===id);if(!c)return;if(!confirm(`Remover a comissão de ${c.name}?`))return;const r=await sb.from('commissions').delete().eq('id',id);if(r.error)return alert(r.error.message);state.commissions=state.commissions.filter(x=>x.id!==id);renderApp()}
function calendar(){const first=new Date(calendarDate(1));const daysInMonth=new Date(state.calendarYear,state.calendarMonth,0).getDate();const start=(first.getDay()+6)%7;const cells=[];for(let i=0;i<start;i++)cells.push('<div class="calday emptyday"></div>');for(let d=1;d<=daysInMonth;d++){const ds=`${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=state.calendar.filter(e=>e.date===ds);cells.push(`<div class="calday"><div class="calhead"><strong>${d}</strong><button class="caladd" onclick="newCalendarEvent('${ds}')">+</button></div>${ev.map(e=>`<div class="calevent ${e.completed?'done':''}"><span onclick="toggleCalendarEvent('${e.id}')">${e.completed?'✓':'○'} ${esc(e.title)}${e.task_id?' <small style=\"opacity:.7\">(Tarefa)</small>':''}</span>${e.task_id?'':'<button onclick="deleteCalendarEvent(\''+e.id+'\')">×</button>'}</div>`).join('')}</div>`)}return `<div class="top"><div><h1>Calendário</h1><div class="muted">Organize obrigações e compromissos por data</div></div><div style="display:flex;gap:8px;align-items:center"><button class="secondary" onclick="changeMonth(-1)">←</button><strong style="min-width:150px;text-align:center">${monthName(state.calendarMonth)} ${state.calendarYear}</strong><button class="secondary" onclick="changeMonth(1)">→</button></div></div><div class="section"><div class="calendarGrid"><div class="weekday">SEG</div><div class="weekday">TER</div><div class="weekday">QUA</div><div class="weekday">QUI</div><div class="weekday">SEX</div><div class="weekday">SÁB</div><div class="weekday">DOM</div>${cells.join('')}</div></div>`}
function calendarDate(day){return `${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}T12:00:00`}
function monthName(m){return new Date(2026,m-1,1).toLocaleDateString('pt-BR',{month:'long'}).replace(/^./,x=>x.toUpperCase())}
function changeMonth(delta){state.calendarMonth+=delta;if(state.calendarMonth>12){state.calendarMonth=1;state.calendarYear++}if(state.calendarMonth<1){state.calendarMonth=12;state.calendarYear--}renderApp()}
function newCalendarEvent(date){modal('Nova obrigação',`<label>Obrigação</label><input class="input" id="title" placeholder="Ex.: pagar fornecedor"><label>Data</label><input class="input" id="date" type="date" value="${date}"><label>Tipo</label><select class="input" id="type"><option>Obrigação</option><option>Pagamento</option><option>Reunião</option><option>Entrega</option><option>Vencimento</option><option>Outro</option></select><label>Observação</label><textarea class="input" id="notes" rows="3" placeholder="Detalhes"></textarea>`,async x=>{const title=x.querySelector('#title').value.trim();if(!title)return false;const r=await insert('calendar',{title,date:x.querySelector('#date').value,type:x.querySelector('#type').value,notes:x.querySelector('#notes').value,completed:false});state.calendar.push(r);renderApp();return true})}
async function toggleCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);if(!e)return;try{e.completed=!e.completed;await update('calendar',id,{completed:e.completed});if(e.task_id){const t=state.tasks.find(x=>x.id===e.task_id);if(t){t.status=e.completed?'Concluída':'A fazer';await update('tasks',t.id,{status:t.status})}}renderApp()}catch(err){alert(err.message||'Não foi possível atualizar o compromisso.')}}
async function deleteCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);if(!e)return;if(!confirm(`Remover a obrigação "${e.title}"?`))return;const r=await sb.from('calendar').delete().eq('id',id);if(r.error)return alert(r.error.message);state.calendar=state.calendar.filter(x=>x.id!==id);renderApp()}

function profile(){
 const email=state.user.email||'';const created=state.profile?.created_at?new Date(state.profile.created_at).toLocaleDateString('pt-BR'):'-';
 return `<div class="top"><div><h1>PERFIL</h1><div class="muted">Sua conta do CAFÉ DO PADRIM</div></div></div>
 <div class="profileHero"><div class="avatar">${initials(email)}</div><div><strong>${esc(email)}</strong><div class="profileEmail">Perfil criado em ${created}</div></div></div>
 <div class="section"><h2>Conta</h2><p>Este perfil é vinculado ao e-mail <strong>${esc(email)}</strong>.</p>
 <div class="profileActions"><button class="primary" onclick="changePassword()">Alterar senha</button><button class="secondary" onclick="switchAccount()">Trocar de conta</button><button class="secondary" onclick="logout()">Sair da conta</button></div>
 </div>
 <div class="section" style="margin-top:14px"><h2>Trocar de conta</h2><p class="muted">Para entrar com outra pessoa, saia deste perfil e use o e-mail e a senha do outro perfil. Cada conta possui seus próprios clientes, leads, pedidos, produtos e tarefas.</p><button class="primary" onclick="switchAccount()">SAIR E ENTRAR COM OUTRA CONTA</button></div>`;
}
async function changePassword(){
 const p=prompt('Digite a nova senha:');
 if(!p)return;
 const p2=prompt('Digite novamente a nova senha:');
 if(p!==p2)return alert('As senhas não conferem.');
 const r=await sb.auth.updateUser({password:p});
 if(r.error)alert(r.error.message);else alert('Senha alterada com sucesso.');
}
async function switchAccount(){await logout()}

function renderApp(){
 if(!state.user)return;
 if(!document.getElementById('app'))shell();
 layout();
 const pages={dashboard,leads,orders,coffees,suppliers,inventory,products,tasks,finance,commission,calendar,profile};
 document.getElementById('app').innerHTML=pages[state.page]();
}
async function boot(){
 if(!configured){
  document.getElementById('root').innerHTML=`<div class="auth"><section class="authcard"><div class="logo">☕</div><h1>CAFÉ DO PADRIM</h1><p class="sub">Configuração do Supabase</p><p class="hint">Abra o <b>index.html</b> e preencha SUPABASE_URL e SUPABASE_ANON_KEY com os dados públicos do seu projeto Supabase. Depois execute <b>supabase_schema.sql</b> no SQL Editor.</p></section></div>`;
  return;
 }
 const r=await sb.auth.getSession();
 if(r.data.session)await start(r.data.session.user);else authScreen('login');
 sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){state.user=null;state.profile=null;authScreen('login')}})
}
boot();
</script>
</body>
</html>
