s estão pendentes?')">Pendências</button><button class="secondary" onclick="agentQuickFloating('Quais são os melhores clientes por vendas concluídas?')">Clientes</button></div><div id="padimMessages" class="agentmessages"></div><div id="padimStatus" class="agentstatus">Dados consultados em tempo real a cada solicitação.</div><div class="agentcomposer"><textarea id="padimInput" placeholder="Pergunte ao PADIM..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAgentFloating()}"></textarea><button class="primary" onclick="sendAgentFloating()">Enviar</button></div></div></section></div>`}
function toggleActivities(){const b=document.getElementById("activityBackdrop");if(!b)return;b.classList.toggle("open");if(b.classList.contains("open"))renderActivityGrid()}
function renderActivityGrid(){const g=document.getElementById("activityGrid");if(!g)return;const visible=menus.filter(([k])=>can(k));g.innerHTML=visible.map(([k,t])=>{const parts=t.split(" ");const ico=parts.shift();const label=parts.join(" ");return `<button class="activity-item ${state.page===k?"active":""}" onclick="goActivity('${k}')"><span class="ico">${ico}</span><span>${label}</span><small>${state.page===k?"Aberta agora":"Abrir atividade"}</small></button>`}).join("")}
function goActivity(p){toggleActivities();go(p)}
function layout(){const visible=menus.filter(([k])=>can(k));document.getElementById("nav").innerHTML=visible.map(([k,t])=>`<button class="${state.page===k?"active":""}" onclick="go('${k}')">${t}</button>`).join('<div class="sep"></div>');document.getElementById("mobilebar").innerHTML="";document.getElementById("userbox").innerHTML=`<div class="useremail">${esc(state.user.email)}</div><span class="badge">${esc(roleNames[role()]||role())}</span><br><br><button class="secondary" style="width:100%" onclick="go('profile')">Abrir PERFIL</button>`;if(document.getElementById("activityBackdrop")?.classList.contains("open"))renderActivityGrid()}
function modal(title,body,save){const x=document.createElement('div');x.className='modalback';x.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="secondary" onclick="this.closest('.modalback').remove()">Fechar</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="secondary" onclick="this.closest('.modalback').remove()">Cancelar</button><button class="primary" id="save">Salvar</button></div></div>`;document.body.appendChild(x);x.querySelector('#save').onclick=async()=>{try{if(await save(x)){x.remove()}}catch(e){alert(e.message||'Erro ao salvar')}}}
function dateBR(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-'}
function monthKey(d){return String(d||'').slice(0,7)}
function monthLabel(k){const [y,m]=k.split('-');return new Date(Number(y),Number(m)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function periodOrders(){return state.orders.filter(o=>monthKey(o.date)===state.period&&o.status!=='Cancelado')}
function completedOrders(){return state.orders.filter(o=>o.status==='Concluído')}
function customerById(id){return state.customers.find(c=>c.id===id)}
function coffeeById(id){return state.coffees.find(c=>c.id===id)}
function inbox(){if(!guard('inbox'))return '';const items=state.inbox||[];return `<div class="top"><div><h1>📥 Caixa de Entrada</h1><div class="muted">Anotações recebidas do iPhone/Notas e transformadas em registros do CRM.</div></div><div class="toolbar"><button class="primary" onclick="newInbox()">+ Importar anotação</button><button class="secondary" onclick="photoInbox()">📷 Foto → CRM</button><input id="photoInboxInput" class="photo-input" type="file" accept="image/*" capture="environment" onchange="processPhotoInbox(this)"></div></div><div class="section"><div class="statusbar">Fluxo: <strong>Nota → PADIM → Revisão → CRM</strong></div>${items.length?items.map(x=>`<div class="card" style="margin:10px 0;padding:16px"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${esc(x.summary||'Anotação')}</strong><div class="muted">${dateBR(x.created_at?.slice(0,10))} · ${esc(x.type||'incerto')}</div></div><span class="badge">${Math.round((x.confidence||0)*100)}%</span></div><p>${esc(x.raw_text)}</p><div class="muted">${x.parsed_json?.type==='pedido' ? `<strong>Cliente:</strong> ${esc(x.parsed_json.customer_name||'-')} · <strong>Itens:</strong> ${(x.parsed_json.items||[]).map(i=>esc(i.coffee_name)+' — '+coffee(i.grams)).join(' · ')||'-'} · <strong>Valor:</strong> ${money(x.parsed_json.total_value||0)}` : (x.parsed_json?esc(JSON.stringify(x.parsed_json,null,2)):'')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="approveInbox('${x.id}')">Revisar/Aplicar</button><button class="secondary" onclick="deleteInbox('${x.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma anotação pendente. Você pode importar uma pelo botão acima.</div>'}</div>`}
async function newInbox(){const text=prompt('Cole aqui a anotação do Notas do iPhone:');if(!text?.trim())return;try{toast('PADIM interpretando a anotação...');const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(SUPABASE_URL+'/functions/v1/cafe-padrim-note-parser',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({text:text.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao interpretar');const parsed=d.data;const row=await insert('note_inbox',{raw_text:text.trim(),summary:parsed.summary||'',type:parsed.type||'incerto',confidence:Number(parsed.confidence)||0,parsed_json:parsed,status:'pending'});state.inbox.unshift(row);renderApp();toast('Anotação interpretada. Revise antes de aplicar.')}catch(e){alert(e.message||'Erro ao importar')}}
async function approveInbox(id){const x=(state.inbox||[]).find(v=>v.id===id);if(!x)return;const p=x.parsed_json||{};try{if(p.type==='pedido'){const items=Array.isArray(p.items)?p.items.filter(i=>i&&i.coffee_name&&Number(i.grams)>0):[];if(!p.customer_name||!items.length)return alert('Pedido incompleto: preciso do cliente e de pelo menos um café com quantidade.');const customerName=String(p.customer_name).trim();let customer=state.customers.find(c=>c.name.toLowerCase()===customerName.toLowerCase());if(!customer){if(!confirm(`O cliente “${customerName}” não existe. Criar automaticamente?`))return;customer=await insert('customers',{name:customerName,phone:null,email:null,city:null,obs:'Cadastrado a partir das anotações'});state.customers.push(customer)}const resolved=[];for(const item of items){const c=state.coffees.find(c=>c.name.toLowerCase()===String(item.coffee_name).toLowerCase());if(!c)return alert(`Não encontrei o café “${item.coffee_name}”. Cadastre/ajuste o nome em Cafés antes de aplicar.`);const g=grams(item.grams);if(g>Number(c.stock_grams||0))return alert(`Estoque insuficiente de ${c.name}: ${coffee(c.stock_grams)} disponíveis.`);resolved.push({coffee:c,grams:g})}const total=Number(p.total_value)||0;const totalG=resolved.reduce((s,i)=>s+i.grams,0);const parent=await createOrderInternal({customer:customerName,customer_id:customer.id,coffee_id:resolved[0].coffee.id,coffee_grams:resolved[0].grams,total,payment_method:p.payment_method||'Outro',status:'Concluído',date:p.date||dateNow(),notes:`Importado das anotações: ${x.raw_text}`,source_note_id:id});for(const i of resolved){const itemTotal=total>0?total*(i.grams/totalG):0;await insert('order_items',{order_id:parent.id,coffee_id:i.coffee.id,coffee_name:i.coffee.name,grams:i.grams,item_total:itemTotal});if(i!==resolved[0]){i.coffee.stock_grams=Number(i.coffee.stock_grams||0)-i.grams;await update('coffees',i.coffee.id,{stock_grams:i.coffee.stock_grams});await insert('movements',{coffee_id:i.coffee.id,type:'Saída',grams:i.grams,date:p.date||dateNow(),reason:'Pedido importado das anotações'})}}await update('note_inbox',id,{status:'applied'});toast('Pedido importado automaticamente para o CRM.')}else if(p.type==='tarefa'&&p.task_title){await insert('tasks',{title:p.task_title,date:p.task_date||null,status:'A fazer',responsible:null});await update('note_inbox',id,{status:'applied'});toast('Tarefa criada.')}else if(p.type==='estoque'&&p.inventory_grams){const c=state.coffees.find(c=>String(c.name).toLowerCase()===String(p.inventory_coffee_name||'').toLowerCase());if(!c)return alert('Não encontrei o café pelo nome. Abra Estoque e faça o lançamento manual.');const g=Math.abs(Number(p.inventory_grams));if(p.inventory_kind==='Saída'&&g>Number(c.stock_grams||0))return alert('Estoque insuficiente.');c.stock_grams=Number(c.stock_grams||0)+(p.inventory_kind==='Saída'?-g:g);await update('coffees',c.id,{stock_grams:c.stock_grams});await insert('movements',{coffee_id:c.id,type:p.inventory_kind||'Entrada',grams:g,date:p.date||dateNow(),reason:'Importado das anotações'});await update('note_inbox',id,{status:'applied'});toast('Movimentação aplicada.')}else if(p.type==='despesa'&&p.expense_amount){await insert('expenses',{description:p.expense_description||p.summary||'Despesa importada',amount:Number(p.expense_amount),category:'Importada',date:p.date||dateNow()});await update('note_inbox',id,{status:'applied'});toast('Despesa registrada.')}else{alert('A anotação precisa de revisão manual antes de virar um registro.')}await loadAll();renderApp()}catch(e){alert(e.message||'Não foi possível aplicar a anotação.')}}
async function deleteInbox(id){if(!confirm('Excluir esta anotação?'))return;await remove('note_inbox',id);state.inbox=state.inbox.filter(x=>x.id!==id);renderApp()}
function dashboard(){const done=completedOrders(),rev=done.reduce((s,o)=>s+Number(o.total||0),0),sold=done.reduce((s,o)=>s+Number(o.coffee_grams||0),0),exp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),com=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0),stock=state.coffees.reduce((s,c)=>s+Number(c.stock_grams||0),0),result=rev-exp-com,low=state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0));const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);const k=d.toISOString().slice(0,7);return{k,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),value:done.filter(o=>monthKey(o.date)===k).reduce((s,o)=>s+Number(o.total||0),0)}}),max=Math.max(...months.map(m=>m.value),1);const topCustomers=[...state.customers].map(c=>({c,total:done.filter(o=>o.customer_id===c.id||(!o.customer_id&&o.customer===c.name)).reduce((s,o)=>s+Number(o.total||0),0)})).sort((a,b)=>b.total-a.total).slice(0,5);return `<div class="top"><div><h1>Dashboard</h1><div class="muted">Visão geral da operação e dos resultados</div></div><button class="primary" onclick="go('myday')">🏠 Meu Dia</button></div><div class="cards"><div class="card"><div class="muted">Faturamento concluído</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(result)}</div></div><div class="card"><div class="muted">Café vendido</div><div class="metric">${coffee(sold)}</div></div><div class="card"><div class="muted">Estoque atual</div><div class="metric">${coffee(stock)}</div><div class="forecast">${low.length?low.length+" item(ns) em nível crítico":"Estoque dentro do mínimo"}</div></div></div><div class="grid"><div class="section"><h2>Faturamento — últimos 6 meses</h2><div class="bars">${months.map(m=>`<div class="baritem"><div class="barvalue">${money(m.value)}</div><div class="bar"><span style="height:${Math.max(4,m.value/max*150)}px"></span></div><div class="barlabel">${esc(m.label)}</div></div>`).join('')}</div></div><div class="section"><h2>Alertas</h2>${low.length?low.map(c=>`<div class="lead"><strong>⚠️ ${esc(c.name)}</strong><span class="badge danger">${coffee(c.stock_grams)} · mínimo ${coffee(c.min_stock_grams)}</span></div>`).join(''):'<div class="empty">Estoque saudável.</div>'}</div></div><div class="grid3"><div class="section"><h2>Pedidos no mês</h2><div class="metric">${periodOrders().length}</div><div class="muted">${monthLabel(state.period)}</div></div><div class="section"><h2>Leads ativos</h2><div class="metric">${state.leads.filter(l=>l.stage!=='Venda realizada').length}</div><div class="muted">Oportunidades abertas</div></div><div class="section"><h2>Clientes</h2><div class="metric">${state.customers.length}</div><div class="muted">Base cadastrada</div></div></div><div class="grid"><div class="section"><h2>Melhores clientes</h2>${topCustomers.map(x=>`<div class="lead"><strong>${esc(x.c.name)}</strong><span class="muted">${money(x.total)} em vendas concluídas</span></div>`).join('')||'<div class="empty">Cadastre clientes para acompanhar recorrência.</div>'}</div><div class="section"><h2>Próximas obrigações</h2>${state.calendar.filter(e=>!e.completed&&e.date>=dateNow()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(e=>`<div class="lead"><strong>${esc(e.title)}</strong><span class="muted">${dateBR(e.date)} · ${esc(e.type||'Obrigação')}</span></div>`).join('')||'<div class="empty">Nenhuma obrigação próxima.</div>'}</div></div>`}
function customers(){const q=state.search.toLowerCase();const list=state.customers.filter(c=>`${c.name} ${c.phone||''} ${c.email||''}`.toLowerCase().includes(q));return `<div class="top"><div><h1>Clientes</h1><div class="muted">Histórico de relacionamento, pedidos e recorrência</div></div><button class="primary" onclick="newCustomer()">+ Cliente</button></div><div class="section"><div class="search"><input class="input" placeholder="Buscar cliente..." value="${esc(state.search)}" oninput="state.search=this.value;renderApp()"></div>${list.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Contato</th><th>Pedidos</th><th>Total comprado</th><th>Última compra</th><th>Ações</th></tr>${list.map(c=>{const os=state.orders.filter(o=>o.customer_id===c.id||(!o.customer_id&&o.customer===c.name));const done=os.filter(o=>o.status==='Concluído');const total=done.reduce((s,o)=>s+Number(o.total||0),0);const last=done.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];return `<tr><td><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.city||'')}</span></td><td>${esc(c.phone||c.email||'-')}</td><td>${os.length}</td><td>${money(total)}</td><td>${dateBR(last?.date)}</td><td><button class="secondary" onclick="customerDetail('${c.id}')">Ver</button> <button class="secondary" onclick="customerWhatsapp('${c.id}')">💬</button> <button class="secondary" onclick="editCustomer('${c.id}')">Editar</button> <button class="dangerbtn" onclick="deleteCustomer('${c.id}')">Apagar</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Nenhum cliente encontrado.</div>'}</div>`}
function customerForm(c={}){return `<div class="formgrid"><div><label>Nome</label><input class="input" id="name" value="${esc(c.name||'')}"></div><div><label>Telefone / WhatsApp</label><input class="input" id="phone" value="${esc(c.phone||'')}"></div><div><label>E-mail</label><input class="input" id="email" value="${esc(c.email||'')}"></div><div><label>Cidade</label><input class="input" id="city" value="${esc(c.city||'')}"></div><div class="full"><label>Observações</label><textarea class="input" id="obs" rows="3">${esc(c.obs||'')}</textarea></div></div>`}
async function saveCustomer(x,id=null){const row={name:x.querySelector('#name').value.trim(),phone:x.querySelector('#phone').value.trim(),email:x.querySelector('#email').value.trim(),city:x.querySelector('#city').value.trim(),obs:x.querySelector('#obs').value.trim()};if(!row.name)return false;if(id){await update('customers',id,row);Object.assign(customerById(id),row)}else state.customers.push(await insert('customers',row));renderApp();toast('Cliente salvo');return true}
function newCustomer(){modal('Novo cliente',customerForm(),x=>saveCustomer(x))}function editCustomer(id){modal('Editar cliente',customerForm(customerById(id)),x=>saveCustomer(x,id))}
async function deleteCustomer(id){const c=customerById(id);if(!c)return;if(state.orders.some(o=>o.customer_id===id))return alert('Este cliente possui pedidos vinculados. Mantenha o cadastro para preservar o histórico.');if(!confirm(`Apagar ${c.name}?`))return;await remove('customers',id);state.customers=state.customers.filter(x=>x.id!==id);renderApp()}
function customerDetail(id){const c=customerById(id);if(!c)return;const os=state.orders.filter(o=>o.customer_id===id||(!o.customer_id&&o.customer===c.name)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal(`Cliente · ${c.name}`,`<div class="profileHero"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.name)}</strong><div class="profileEmail">${esc(c.phone||'Sem telefone')} · ${esc(c.email||'Sem e-mail')}</div></div></div><h3>Histórico</h3>${os.map(o=>`<div class="lead"><strong>${dateBR(o.date)} · ${money(o.total)}</strong><span class="muted">${coffee(o.coffee_grams)} · ${esc(o.status)}</span></div>`).join('')||'<div class="empty">Nenhum pedido.</div>'}`,async()=>true)}
function leads(){return `<div class="top"><div><h1>Leads & Pipeline</h1><div class="muted">Oportunidades comerciais</div></div><button class="primary" onclick="newLead()">+ Novo lead</button></div><div class="kanban">${stages.map(st=>`<div class="col"><h3>${st}</h3>${state.leads.filter(l=>l.stage===st).map(l=>`<div class="lead"><strong>${esc(l.name)}</strong><span class="muted">Potencial: ${money(l.value)}</span><br><span class="muted">Café: ${coffee(l.coffee_grams)}</span><br><span class="badge ${l.delivered?'ok':''}">${l.delivered?'Venda registrada':'Em andamento'}</span><br><button class="secondary" style="margin-top:7px" onclick="advance('${l.id}')">Avançar →</button> <button class="secondary" style="margin-top:7px" onclick="editLead('${l.id}')">Editar</button>${l.phone?` <button class="secondary" style="margin-top:7px" onclick="whats('${l.phone}','Olá, ${l.name}!')">WhatsApp</button>`:''}${!l.delivered?` <button class="primary" style="margin-top:7px" onclick="deliverLead('${l.id}')">Fechar venda</button>`:''}</div>`).join('')||'<div class="muted" style="padding:10px">Vazio</div>'}</div>`).join('')}</div>`}
function leadForm(l={}){return `<div class="formgrid"><div><label>Nome</label><input class="input" id="name" value="${esc(l.name||'')}"></div><div><label>WhatsApp</label><input class="input" id="phone" value="${esc(l.phone||'')}"></div><div><label>Valor potencial</label><input class="input" id="value" type="number" step="0.01" value="${Number(l.value||0)}"></div><div><label>Interesse</label><input class="input" id="interest" value="${esc(l.interest||'')}" placeholder="Café, kit, assinatura..."></div><div><label>Quantidade</label><input class="input" id="qty" type="number" min="0" step="0.01" value="${l.coffee_grams>=1000?l.coffee_grams/1000:l.coffee_grams||0}"></div><div><label>Unidade</label><select class="input" id="unit"><option value="g" ${l.coffee_grams<1000?'selected':''}>g</option><option value="kg" ${l.coffee_grams>=1000?'selected':''}>kg</option></select></div></div>`}
async function saveLead(x,id=null){const row={name:x.querySelector('#name').value.trim(),phone:x.querySelector('#phone').value.trim(),value:Number(x.querySelector('#value').value)||0,interest:x.querySelector('#interest').value.trim(),coffee_grams:parseCoffee(x.querySelector('#qty').value,x.querySelector('#unit').value)};if(!row.name)return false;if(id){await update('leads',id,row);Object.assign(state.leads.find(l=>l.id===id),row)}else state.leads.push(await insert('leads',{...row,stage:'Novo Lead',delivered:false}));renderApp();return true}
function newLead(){modal('Novo lead',leadForm(),x=>saveLead(x))}function editLead(id){const l=state.leads.find(x=>x.id===id);modal('Editar lead',leadForm(l),x=>saveLead(x,id))}
async function advance(id){const l=state.leads.find(x=>x.id===id),i=stages.indexOf(l.stage);if(i<stages.length-1){l.stage=stages[i+1];await update('leads',id,{stage:l.stage});renderApp()}}
function whats(phone,text){let p=String(phone).replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank')}
async function deliverLead(id){const l=state.leads.find(x=>x.id===id);if(!l)return;const val=prompt(`Valor da venda para ${l.name}:`);if(val===null)return;const total=Number(String(val).replace(',','.'));if(!Number.isFinite(total)||total<0)return alert('Valor inválido.');try{const o=await createOrderInternal({customer:l.name,total,coffee_grams:grams(l.coffee_grams),status:'Concluído',date:dateNow(),customer_id:(state.customers.find(c=>c.name.toLowerCase()===l.name.toLowerCase())||{}).id||null});l.delivered=true;l.sale_value=total;l.delivered_at=new Date().toISOString();l.stage='Venda realizada';await update('leads',id,{delivered:true,sale_value:total,delivered_at:l.delivered_at,stage:l.stage});state.orders.push(o);renderApp();toast('Venda registrada no pedido')}catch(e){alert(e.message||'Não foi possível registrar a venda.')}}
function orders(){const q=state.search.toLowerCase();const list=state.orders.slice().reverse().filter(o=>`${o.customer} ${o.status} ${o.payment_method||''}`.toLowerCase().includes(q));return `<div class="top"><div><h1>Pedidos</h1><div class="muted">Fluxo de venda, estoque, pagamento e margem</div></div><button class="primary" onclick="newOrder()">+ Pedido</button></div><div class="section"><div class="toolbar"><input class="input" placeholder="Buscar cliente/status..." value="${esc(state.search)}" oninput="state.search=this.value;renderApp()"><select class="input" onchange="state.period=this.value;renderApp()"><option value="all">Todos os períodos</option>${[...new Set(state.orders.map(o=>monthKey(o.date)).filter(Boolean))].sort().reverse().map(k=>`<option value="${k}" ${state.period===k?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div><br>${list.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Data</th><th>Café</th><th>Valor</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr>${list.filter(o=>state.period==='all'||monthKey(o.date)===state.period).map(o=>`<tr><td><strong>${esc(o.customer)}</strong></td><td>${dateBR(o.date)}</td><td>${coffee(o.coffee_grams)}</td><td>${money(o.total)}</td><td>${esc(o.payment_method||'-')}</td><td><span class="badge ${o.status==='Concluído'?'ok':o.status==='Cancelado'?'danger':''}">${esc(o.status)}</span></td><td><button class="secondary" onclick="editOrder('${o.id}')">Editar</button> <button class="secondary" onclick="orderDetail('${o.id}')">Detalhes</button> <button class="secondary printbtn" onclick="printOrder('${o.id}')">🧾 PDF</button> <button class="dangerbtn" onclick="deleteOrder('${o.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum pedido.</div>'}</div>`}
function orderForm(o={}){return `<div class="formgrid"><div><label>Cliente</label><select class="input" id="customer_id"><option value="">Selecionar / digitar nome abaixo</option>${state.customers.map(c=>`<option value="${c.id}" ${o.customer_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Nome do cliente</label><input class="input" id="customer" value="${esc(o.customer||'')}"></div><div><label>Café</label><select class="input" id="coffee_id"><option value="">Sem café vinculado</option>${state.coffees.map(c=>`<option value="${c.id}" ${o.coffee_id===c.id?'selected':''}>${esc(c.name)} · ${money(c.sale_per_kg)}/kg</option>`).join('')}</select></div><div><label>Quantidade</label><input class="input" id="qty" type="number" min="0" step="0.01" value="${o.coffee_grams>=1000?o.coffee_grams/1000:o.coffee_grams||0}"></div><div><label>Unidade</label><select class="input" id="unit"><option value="g" ${o.coffee_grams<1000?'selected':''}>g</option><option value="kg" ${o.coffee_grams>=1000?'selected':''}>kg</option></select></div><div><label>Valor da venda</label><input class="input" id="total" type="number" min="0" step="0.01" value="${Number(o.total||0)}"></div><div><label>Forma de pagamento</label><select class="input" id="payment"><option ${o.payment_method==='Pix'?'selected':''}>Pix</option><option ${o.payment_method==='Dinheiro'?'selected':''}>Dinheiro</option><option ${o.payment_method==='Cartão'?'selected':''}>Cartão</option><option ${o.payment_method==='Boleto'?'selected':''}>Boleto</option><option ${o.payment_method==='Outro'?'selected':''}>Outro</option></select></div><div><label>Status</label><select class="input" id="status">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Data</label><input class="input" id="date" type="date" value="${esc(o.date||dateNow())}"></div><div class="full"><label>Observações</label><textarea class="input" id="notes" rows="3">${esc(o.notes||'')}</textarea></div></div>`}
async function createOrderInternal(row){const coffeeObj=row.coffee_id?coffeeById(row.coffee_id):null;if(row.status==='Concluído'&&coffeeObj&&grams(row.coffee_grams)>Number(coffeeObj.stock_grams||0))throw new Error(`Estoque insuficiente de ${coffeeObj.name}.`);if(row.status==='Concluído'&&coffeeObj&&grams(row.coffee_grams)>0){coffeeObj.stock_grams=Number(coffeeObj.stock_grams||0)-grams(row.coffee_grams);await update('coffees',coffeeObj.id,{stock_grams:coffeeObj.stock_grams});await insert('movements',{coffee_id:coffeeObj.id,type:'Saída',grams:grams(row.coffee_grams),date:row.date||dateNow(),reason:'Pedido concluído'})}return await insert('orders',{...row,stock_applied:row.status==='Concluído'})}
async function saveOrder(x,id=null){const selected=x.querySelector('#customer_id').value;const name=x.querySelector('#customer').value.trim()||customerById(selected)?.name||'';if(!name)return false;const row={customer:name,customer_id:selected||null,coffee_id:x.querySelector('#coffee_id').value||null,coffee_grams:parseCoffee(x.querySelector('#qty').value,x.querySelector('#unit').value),total:Number(x.querySelector('#total').value)||0,payment_method:x.querySelector('#payment').value,status:x.querySelector('#status').value,date:x.querySelector('#date').value,notes:x.querySelector('#notes').value.trim()};if(!id){const r=await createOrderInternal(row);state.orders.push(r)}else{const o=state.orders.find(x=>x.id===id);const wasDone=o.status==='Concluído',nowDone=row.status==='Concluído';const oldCoffee=coffeeById(o.coffee_id),newCoffee=coffeeById(row.coffee_id);if(wasDone&&oldCoffee){oldCoffee.stock_grams=Number(oldCoffee.stock_grams||0)+Number(o.coffee_grams||0);await update('coffees',oldCoffee.id,{stock_grams:oldCoffee.stock_grams});await insert('movements',{coffee_id:oldCoffee.id,type:'Entrada',grams:Number(o.coffee_grams||0),date:dateNow(),reason:'Estorno de edição do pedido'})}if(nowDone&&newCoffee&&grams(row.coffee_grams)>Number(newCoffee.stock_grams||0))throw new Error(`Estoque insuficiente de ${newCoffee.name}.`);if(nowDone&&newCoffee){newCoffee.stock_grams=Number(newCoffee.stock_grams||0)-grams(row.coffee_grams);await update('coffees',newCoffee.id,{stock_grams:newCoffee.stock_grams});await insert('movements',{coffee_id:newCoffee.id,type:'Saída',grams:grams(row.coffee_grams),date:row.date||dateNow(),reason:'Pedido concluído'})}row.stock_applied=nowDone;await update('orders',id,row);Object.assign(o,row)}renderApp();toast('Pedido salvo');return true}
function newOrder(){modal('Novo pedido',orderForm(),x=>saveOrder(x))}function editOrder(id){modal('Editar pedido',orderForm(state.orders.find(o=>o.id===id)),x=>saveOrder(x,id))}
function orderDetail(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const c=coffeeById(o.coffee_id);modal(`Pedido · ${o.customer}`,`<div class="grid3"><div class="card"><div class="muted">Valor</div><div class="metric small">${money(o.total)}</div></div><div class="card"><div class="muted">Café</div><div class="metric small">${coffee(o.coffee_grams)}</div></div><div class="card"><div class="muted">Margem estimada</div><div class="metric small">${money(Number(o.total||0)-Number(c?.cost_per_kg||0)*Number(o.coffee_grams||0)/1000)}</div></div></div><div class="lead"><strong>Status: ${esc(o.status)}</strong><span class="muted">${dateBR(o.date)} · ${esc(o.payment_method||'')}</span></div><p>${esc(o.notes||'Sem observações.')}</p><div class="toolbar no-print"><button class="primary" onclick="printOrder('${id}')">🧾 Gerar pedido/recibo</button><button class="secondary" onclick="newReceivableFromOrder('${id}')">💳 Criar conta a receber</button><button class="secondary" onclick="whatsappOrder('${id}')">💬 Enviar WhatsApp</button></div>`,async()=>true)}
async function deleteOrder(id){const o=state.orders.find(x=>x.id===id);if(!o||!confirm(`Apagar o pedido de ${o.customer}?`))return;if(o.status==='Concluído'&&o.coffee_id){const c=coffeeById(o.coffee_id);if(c){c.stock_grams=Number(c.stock_grams||0)+Number(o.coffee_grams||0);await update('coffees',c.id,{stock_grams:c.stock_grams});await insert('movements',{coffee_id:c.id,type:'Entrada',grams:Number(o.coffee_grams||0),date:dateNow(),reason:'Estorno por exclusão de pedido'})}}await remove('orders',id);state.orders=state.orders.filter(x=>x.id!==id);renderApp()}
function newReceivableFromOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;modal('Conta a receber do pedido',`<label>Vencimento</label><input class="input" id="due" type="date" value="${dateNow()}"><label>Descrição</label><input class="input" id="description" value="Pedido de ${esc(o.customer)}"><div class="statusbar">Valor: <strong>${money(o.total)}</strong></div>`,async x=>{await insert('receivables',{customer_name:o.customer,description:x.querySelector('#description').value.trim(),amount:Number(o.total||0),due_date:x.querySelector('#due').value,status:'Aberto',order_id:o.id});await loadAll();renderApp();return true})}
function whatsappOrder(id){const o=state.orders.find(x=>x.id===id);const c=customerById(o?.customer_id);if(!o)return;whatsappCustomer(c?.phone||'',`Olá, ${o.customer}! Seu pedido de ${coffee(o.coffee_grams)} no valor de ${money(o.total)} está com status: ${o.status}.`)}
function coffees(){return `<div class="top"><div><h1>Cafés</h1><div class="muted">Catálogo, custo, preço, margem e estoque</div></div><button class="primary" onclick="newCoffee()">+ Novo café</button></div><div class="section">${state.coffees.length?`<div class="tablewrap"><table><tr><th>Café</th><th>Origem</th><th>Fornecedor</th><th>Custo/kg</th><th>Venda/kg</th><th>Margem</th><th>Estoque</th><th>Ações</th></tr>${state.coffees.map(c=>{const margin=Number(c.sale_per_kg||0)-Number(c.cost_per_kg||0);return `<tr><td>${c.photo_url?`<img class="photo" src="${esc(c.photo_url)}"> `:''}<strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.roast||'')} · ${esc(c.process||'')}</span></td><td>${esc(c.origin||'-')}</td><td>${esc(state.suppliers.find(s=>s.id===c.supplier_id)?.name||'-')}</td><td>${money(c.cost_per_kg)}</td><td>${money(c.sale_per_kg)}</td><td>${money(margin)}/kg</td><td><span class="badge ${Number(c.stock_grams)<=Number(c.min_stock_grams)?'danger':'ok'}">${coffee(c.stock_grams)}</span></td><td><button class="secondary" onclick="editCoffee('${c.id}')">Editar</button> <button class="dangerbtn" onclick="deleteCoffee('${c.id}')">Apagar</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Cadastre seu primeiro café.</div>'}</div>`}
function coffeeForm(c={}){return `<div class="formgrid"><div><label>Nome do café</label><input class="input" id="name" value="${esc(c.name||'')}"></div><div><label>Fornecedor</label><select class="input" id="supplier"><option value="">Sem fornecedor</option>${state.suppliers.map(s=>`<option value="${s.id}" ${c.supplier_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label>Origem</label><input class="input" id="origin" value="${esc(c.origin||'')}"></div><div><label>Produtor</label><input class="input" id="producer" value="${esc(c.producer||'')}"></div><div><label>Torra</label><select class="input" id="roast"><option ${c.roast==='Clara'?'selected':''}>Clara</option><option ${c.roast==='Média'?'selected':''}>Média</option><option ${c.roast==='Escura'?'selected':''}>Escura</option></select></div><div><label>Processo</label><input class="input" id="process" value="${esc(c.process||'')}"></div><div><label>Custo por kg</label><input class="input" id="cost" type="number" step="0.01" value="${Number(c.cost_per_kg||0)}"></div><div><label>Venda por kg</label><input class="input" id="sale" type="number" step="0.01" value="${Number(c.sale_per_kg||0)}"></div><div><label>Estoque atual (g)</label><input class="input" id="stock" type="number" min="0" value="${Number(c.stock_grams||0)}"></div><div><label>Estoque mínimo (g)</label><input class="input" id="min" type="number" min="0" value="${Number(c.min_stock_grams||0)}"></div><div class="full"><label>Foto por URL</label><input class="input" id="photo" value="${esc(c.photo_url||'')}" placeholder="https://..."></div></div>`}
async function saveCoffee(x,id=null){const row={name:x.querySelector('#name').value.trim(),supplier_id:x.querySelector('#supplier').value||null,origin:x.querySelector('#origin').value.trim(),producer:x.querySelector('#producer').value.trim(),roast:x.querySelector('#roast').value,process:x.querySelector('#process').value.trim(),cost_per_kg:Number(x.querySelector('#cost').value)||0,sale_per_kg:Number(x.querySelector('#sale').value)||0,stock_grams:Number(x.querySelector('#stock').value)||0,min_stock_grams:Number(x.querySelector('#min').value)||0,photo_url:x.querySelector('#photo').value.trim()||null};if(!row.name)return false;if(id){await update('coffees',id,row);Object.assign(coffeeById(id),row)}else state.coffees.push(await insert('coffees',row));renderApp();return true}
function newCoffee(){modal('Novo café',coffeeForm(),x=>saveCoffee(x))}function editCoffee(id){modal('Editar café',coffeeForm(coffeeById(id)),x=>saveCoffee(x,id))}async function deleteCoffee(id){const c=coffeeById(id);if(!c||!confirm(`Apagar ${c.name}?`))return;if(state.orders.some(o=>o.coffee_id===id))return alert('Este café possui pedidos vinculados. Mantenha o cadastro para preservar o histórico.');await remove('coffees',id);state.coffees=state.coffees.filter(x=>x.id!==id);renderApp()}
function suppliers(){return `<div class="top"><div><h1>Fornecedores</h1><div class="muted">Parceiros, contatos e cafés fornecidos</div></div><button class="primary" onclick="newSupplier()">+ Fornecedor</button></div><div class="section">${state.suppliers.length?`<div class="tablewrap"><table><tr><th>Nome</th><th>Contato</th><th>Cidade</th><th>Cafés</th><th>Ações</th></tr>${state.suppliers.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.phone||s.email||'-')}</td><td>${esc(s.city||'-')}</td><td>${state.coffees.filter(c=>c.supplier_id===s.id).map(c=>esc(c.name)).join(', ')||'-'}</td><td><button class="secondary" onclick="editSupplier('${s.id}')">Editar</button> <button class="dangerbtn" onclick="deleteSupplier('${s.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum fornecedor.</div>'}</div>`}
function supplierForm(s={}){return `<label>Nome</label><input class="input" id="name" value="${esc(s.name||'')}"><label>Telefone</label><input class="input" id="phone" value="${esc(s.phone||'')}"><label>E-mail</label><input class="input" id="email" value="${esc(s.email||'')}"><label>Cidade</label><input class="input" id="city" value="${esc(s.city||'')}"><label>Observações</label><textarea class="input" id="notes" rows="3">${esc(s.notes||'')}</textarea>`}
async function saveSupplier(x,id=null){const row={name:x.querySelector('#name').value.trim(),phone:x.querySelector('#phone').value.trim(),email:x.querySelector('#email').value.trim(),city:x.querySelector('#city').value.trim(),notes:x.querySelector('#notes').value.trim()};if(!row.name)return false;if(id){await update('suppliers',id,row);Object.assign(state.suppliers.find(s=>s.id===id),row)}else state.suppliers.push(await insert('suppliers',row));renderApp();return true}
function newSupplier(){modal('Novo fornecedor',supplierForm(),x=>saveSupplier(x))}function editSupplier(id){modal('Editar fornecedor',supplierForm(state.suppliers.find(s=>s.id===id)),x=>saveSupplier(x,id))}async function deleteSupplier(id){if(state.coffees.some(c=>c.supplier_id===id))return alert('Não é possível apagar: existem cafés vinculados.');if(!confirm('Apagar fornecedor?'))return;await remove('suppliers',id);state.suppliers=state.suppliers.filter(s=>s.id!==id);renderApp()}
function inventory(){const low=state.coffees.filter(c=>Number(c.stock_grams)<=Number(c.min_stock_grams));return `<div class="top"><div><h1>Estoque</h1><div class="muted">Entradas, saídas e histórico de movimentações</div></div><button class="primary" onclick="newMovement()">+ Movimentação</button></div><div class="grid3">${state.coffees.map(c=>`<div class="card"><strong>${esc(c.name)}</strong><div class="metric small">${coffee(c.stock_grams)}</div><div class="progress"><span style="width:${Math.min(100,Number(c.min_stock_grams)>0?Math.max(5,Number(c.stock_grams)/Number(c.min_stock_grams)*50):100)}%"></span></div><div class="muted">Mínimo: ${coffee(c.min_stock_grams)}</div>${Number(c.stock_grams)<=Number(c.min_stock_grams)?'<span class="badge danger">Comprar</span>':''}</div>`).join('')||'<div class="empty">Cadastre cafés.</div>'}</div><div class="section" style="margin-top:14px"><h2>Histórico</h2>${state.movements.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Café</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>${state.movements.slice().reverse().map(m=>`<tr><td>${dateBR(m.date)}</td><td>${esc(coffeeById(m.coffee_id)?.name||'-')}</td><td><span class="badge ${m.type==='Entrada'?'ok':'warn'}">${esc(m.type)}</span></td><td>${coffee(m.grams)}</td><td>${esc(m.reason||'-')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma movimentação.</div>'}</div>${low.length?`<div class="section" style="margin-top:14px"><strong>⚠️ Compras sugeridas:</strong> ${low.map(c=>esc(c.name)).join(', ')}</div>`:''}`}
function newMovement(){modal('Nova movimentação',`<label>Café</label><select class="input" id="coffee">${state.coffees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Tipo</label><select class="input" id="type"><option>Entrada</option><option>Saída</option></select><label>Quantidade</label><div class="formgrid"><input class="input" id="qty" type="number" min="0.01" step="0.01" placeholder="Quantidade"><select class="input" id="unit"><option value="g">g</option><option value="kg">kg</option></select></div><label>Data</label><input class="input" id="date" type="date" value="${dateNow()}"><label>Motivo</label><input class="input" id="reason" placeholder="Compra, ajuste, perda..."><div class="hint" style="text-align:left">Pedidos concluídos já movimentam o estoque automaticamente.</div>`,async x=>{const c=coffeeById(x.querySelector('#coffee').value),g=parseCoffee(x.querySelector('#qty').value,x.querySelector('#unit').value),type=x.querySelector('#type').value;if(!c||g<=0)return false;if(type==='Saída'&&g>Number(c.stock_grams||0))return alert('Estoque insuficiente.'),false;c.stock_grams=Number(c.stock_grams||0)+(type==='Entrada'?g:-g);await update('coffees',c.id,{stock_grams:c.stock_grams});state.movements.push(await insert('movements',{coffee_id:c.id,type,grams:g,date:x.querySelector('#date').value,reason:x.querySelector('#reason').value.trim()}));renderApp();return true})}
function products(){return `<div class="top"><div><h1>Produtos</h1><div class="muted">Itens complementares ao café</div></div><button class="primary" onclick="newProduct()">+ Produto</button></div><div class="section">${state.products.length?`<div class="tablewrap"><table><tr><th>Produto</th><th>Preço</th><th>Custo</th><th>Margem</th><th>Estoque</th><th>Ações</th></tr>${state.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${money(Number(p.price||0)-Number(p.cost||0))}</td><td><span class="badge ${Number(p.stock)<=Number(p.min||0)?'danger':'ok'}">${p.stock}</span></td><td><button class="secondary" onclick="editProduct('${p.id}')">Editar</button> <button class="dangerbtn" onclick="deleteProduct('${p.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum produto.</div>'}</div>`}
function productForm(p={}){return `<div class="formgrid"><div><label>Nome</label><input class="input" id="name" value="${esc(p.name||'')}"></div><div><label>Preço</label><input class="input" id="price" type="number" step="0.01" value="${Number(p.price||0)}"></div><div><label>Custo</label><input class="input" id="cost" type="number" step="0.01" value="${Number(p.cost||0)}"></div><div><label>Estoque</label><input class="input" id="stock" type="number" value="${Number(p.stock||0)}"></div><div><label>Estoque mínimo</label><input class="input" id="min" type="number" value="${Number(p.min||0)}"></div></div>`}
async function saveProduct(x,id=null){const row={name:x.querySelector('#name').value.trim(),price:Number(x.querySelector('#price').value)||0,cost:Number(x.querySelector('#cost').value)||0,stock:Number(x.querySelector('#stock').value)||0,min:Number(x.querySelector('#min').value)||0};if(!row.name)return false;if(id){await update('products',id,row);Object.assign(state.products.find(p=>p.id===id),row)}else state.products.push(await insert('products',row));renderApp();return true}function newProduct(){modal('Novo produto',productForm(),x=>saveProduct(x))}function editProduct(id){modal('Editar produto',productForm(state.products.find(p=>p.id===id)),x=>saveProduct(x,id))}async function deleteProduct(id){if(!confirm('Apagar produto?'))return;await remove('products',id);state.products=state.products.filter(p=>p.id!==id);renderApp()}
function tasks(){const list=state.tasks.slice().sort((a,b)=>String(a.date||'9999').localeCompare(String(b.date||'9999')));return `<div class="top"><div><h1>Tarefas</h1><div class="muted">Tarefas com data sincronizam com o Calendário</div></div><button class="primary" onclick="newTask()">+ Tarefa</button></div><div class="section">${list.map(t=>`<div class="lead"><strong>${t.status==='Concluída'?'✅':'⬜'} ${esc(t.title)}</strong><span class="muted">${t.date?dateBR(t.date):'Sem data'} · ${esc(t.status)}</span><br><button class="secondary" style="margin-top:7px" onclick="completeTask('${t.id}')">${t.status==='Concluída'?'Reabrir':'Concluir'}</button> <button class="secondary" style="margin-top:7px" onclick="editTask('${t.id}')">Editar</button> <button class="dangerbtn" style="margin-top:7px" onclick="deleteTask('${t.id}')">Apagar</button></div>`).join('')||'<div class="empty">Nenhuma tarefa.</div>'}</div>`}
function taskForm(t={}){return `<label>Tarefa</label><input class="input" id="title" value="${esc(t.title||'')}" placeholder="Ex.: pedir café ao fornecedor"><label>Data</label><input class="input" id="date" type="date" value="${esc(t.date||'')}"><label>Responsável</label><input class="input" id="responsible" value="${esc(t.responsible||'')}" placeholder="Nome da pessoa">`}
async function ensureTaskCalendars(){for(const t of state.tasks){if(!t.date)continue;const linked=state.calendar.find(e=>e.task_id===t.id);if(!linked){try{const r=await insert('calendar',{title:t.title,date:t.date,type:'Tarefa',notes:'Sincronizado automaticamente.',completed:t.status==='Concluída',task_id:t.id});state.calendar.push(r)}catch(e){console.warn(e)}}}}
async function syncTaskCalendar(t){const linked=state.calendar.find(e=>e.task_id===t.id);if(t.date){const row={title:t.title,date:t.date,type:'Tarefa',notes:'Sincronizado automaticamente.',completed:t.status==='Concluída',task_id:t.id};if(linked){await update('calendar',linked.id,row);Object.assign(linked,row)}else state.calendar.push(await insert('calendar',row))}else if(linked){await remove('calendar',linked.id);state.calendar=state.calendar.filter(e=>e.id!==linked.id)}}
async function saveTask(x,id=null){const row={title:x.querySelector('#title').value.trim(),date:x.querySelector('#date').value||null,responsible:x.querySelector('#responsible').value.trim()};if(!row.title)return false;if(id){await update('tasks',id,row);Object.assign(state.tasks.find(t=>t.id===id),row);await syncTaskCalendar(state.tasks.find(t=>t.id===id))}else{const t=await insert('tasks',{...row,status:'A fazer'});state.tasks.push(t);await syncTaskCalendar(t)}renderApp();return true}function newTask(){modal('Nova tarefa',taskForm(),x=>saveTask(x))}function editTask(id){modal('Editar tarefa',taskForm(state.tasks.find(t=>t.id===id)),x=>saveTask(x,id))}async function completeTask(id){const t=state.tasks.find(x=>x.id===id);t.status=t.status==='Concluída'?'A fazer':'Concluída';await update('tasks',id,{status:t.status});await syncTaskCalendar(t);renderApp()}async function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!confirm(`Apagar ${t.title}?`))return;const linked=state.calendar.find(e=>e.task_id===id);if(linked)await remove('calendar',linked.id);await remove('tasks',id);state.tasks=state.tasks.filter(x=>x.id!==id);state.calendar=state.calendar.filter(e=>e.task_id!==id);renderApp()}
function finance(){const rev=completedOrders().reduce((s,o)=>s+Number(o.total||0),0),exp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0),com=state.commissions.reduce((s,c)=>s+Number(c.amount||0),0),res=rev-exp-com;return `<div class="top"><div><h1>Financeiro</h1><div class="muted">Entradas, despesas, comissões e resultado estimado</div></div><button class="primary" onclick="newExpense()">+ Despesa</button></div><div class="cards"><div class="card"><div class="muted">Receita</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="muted">Despesas</div><div class="metric">${money(exp)}</div></div><div class="card"><div class="muted">Comissões</div><div class="metric">${money(com)}</div></div><div class="card"><div class="muted">Resultado estimado</div><div class="metric">${money(res)}</div></div></div><div class="section" style="margin-top:14px"><h2>Despesas</h2>${state.expenses.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Ação</th></tr>${state.expenses.slice().reverse().map(e=>`<tr><td>${dateBR(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category||'-')}</td><td>${money(e.amount)}</td><td><button class="dangerbtn" onclick="deleteExpense('${e.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma despesa.</div>'}</div>`}
function newExpense(){modal('Nova despesa',`<label>Descrição</label><input class="input" id="description" placeholder="Frete, embalagem..."><div class="formgrid"><div><label>Categoria</label><select class="input" id="category"><option>Compra de café</option><option>Frete</option><option>Embalagem</option><option>Operacional</option><option>Marketing</option><option>Outro</option></select></div><div><label>Valor</label><input class="input" id="amount" type="number" min="0" step="0.01"></div><div><label>Data</label><input class="input" id="date" type="date" value="${dateNow()}"></div></div>`,async x=>{const description=x.querySelector('#description').value.trim(),amount=Number(x.querySelector('#amount').value)||0;if(!description||amount<=0)return false;state.expenses.push(await insert('expenses',{description,category:x.querySelector('#category').value,amount,date:x.querySelector('#date').value}));renderApp();return true})}async function deleteExpense(id){if(!confirm('Apagar despesa?'))return;await remove('expenses',id);state.expenses=state.expenses.filter(e=>e.id!==id);renderApp()}
function commission(){return `<div class="top"><div><h1>Comissão</h1><div class="muted">Valores definidos para a equipe</div></div><button class="primary" onclick="newCommission()">+ Comissão</button></div><div class="section">${state.commissions.length?`<div class="tablewrap"><table><tr><th>Nome</th><th>Valor</th><th>Data</th><th>Ações</th></tr>${state.commissions.slice().reverse().map(c=>`<tr><td>${esc(c.name)}</td><td>${money(c.amount)}</td><td>${dateBR(c.created_at?.slice(0,10))}</td><td><button class="secondary" onclick="editCommission('${c.id}')">Editar</button> <button class="dangerbtn" onclick="deleteCommission('${c.id}')">Remover</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma comissão.</div>'}</div>`}
function commissionForm(c={}){return `<label>Nome</label><input class="input" id="name" value="${esc(c.name||'')}"><label>Valor</label><input class="input" id="amount" type="number" min="0" step="0.01" value="${Number(c.amount||0)}">`}
async function saveCommission(x,id=null){const row={name:x.querySelector('#name').value.trim(),amount:Number(x.querySelector('#amount').value)||0};if(!row.name)return false;if(id){await update('commissions',id,row);Object.assign(state.commissions.find(c=>c.id===id),row)}else state.commissions.push(await insert('commissions',row));renderApp();return true}function newCommission(){modal('Nova comissão',commissionForm(),x=>saveCommission(x))}function editCommission(id){modal('Editar comissão',commissionForm(state.commissions.find(c=>c.id===id)),x=>saveCommission(x,id))}async function deleteCommission(id){if(!confirm('Remover comissão?'))return;await remove('commissions',id);state.commissions=state.commissions.filter(c=>c.id!==id);renderApp()}
function calendar(){const first=new Date(state.calendarYear,state.calendarMonth-1,1),days=new Date(state.calendarYear,state.calendarMonth,0).getDate(),start=(first.getDay()+6)%7,cells=[];for(let i=0;i<start;i++)cells.push('<div class="calday emptyday"></div>');for(let d=1;d<=days;d++){const ds=`${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=state.calendar.filter(e=>e.date===ds);cells.push(`<div style="min-height:105px;background:#f8f4f0;border:1px solid var(--line);border-radius:10px;padding:7px"><div style="display:flex;justify-content:space-between"><strong>${d}</strong><button class="secondary" style="padding:2px 7px" onclick="newCalendarEvent('${ds}')">+</button></div>${ev.map(e=>`<div class="calevent ${e.completed?'done':''}" style="background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px;margin:4px 0;font-size:11px"><span onclick="toggleCalendarEvent('${e.id}')" style="cursor:pointer">${e.completed?'✓':'○'} ${esc(e.title)}${e.task_id?' <small>(Tarefa)</small>':''}</span>${e.task_id?'':'<button style="border:0;background:none;color:var(--danger)" onclick="deleteCalendarEvent(\''+e.id+'\')">×</button>'}</div>`).join('')}</div>`)}return `<div class="top"><div><h1>Calendário</h1><div class="muted">Obrigações, tarefas e entregas</div></div><div class="toolbar"><button class="secondary" onclick="changeMonth(-1)">←</button><strong>${monthLabel(`${state.calendarYear}-${String(state.calendarMonth).padStart(2,'0')}`)}</strong><button class="secondary" onclick="changeMonth(1)">→</button></div></div><div class="section"><div style="display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;overflow:auto"><div class="muted">SEG</div><div class="muted">TER</div><div class="muted">QUA</div><div class="muted">QUI</div><div class="muted">SEX</div><div class="muted">SÁB</div><div class="muted">DOM</div>${cells.join('')}</div></div>`}
function changeMonth(d){state.calendarMonth+=d;if(state.calendarMonth>12){state.calendarMonth=1;state.calendarYear++}if(state.calendarMonth<1){state.calendarMonth=12;state.calendarYear--}renderApp()}
function newCalendarEvent(date){modal('Nova obrigação',`<label>Obrigação</label><input class="input" id="title"><label>Data</label><input class="input" id="date" type="date" value="${date}"><label>Tipo</label><select class="input" id="type"><option>Obrigação</option><option>Pagamento</option><option>Reunião</option><option>Entrega</option><option>Vencimento</option><option>Outro</option></select><label>Observação</label><textarea class="input" id="notes" rows="3"></textarea>`,async x=>{const title=x.querySelector('#title').value.trim();if(!title)return false;state.calendar.push(await insert('calendar',{title,date:x.querySelector('#date').value,type:x.querySelector('#type').value,notes:x.querySelector('#notes').value.trim(),completed:false}));renderApp();return true})}async function toggleCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);e.completed=!e.completed;await update('calendar',id,{completed:e.completed});if(e.task_id){const t=state.tasks.find(t=>t.id===e.task_id);if(t){t.status=e.completed?'Concluída':'A fazer';await update('tasks',t.id,{status:t.status})}}renderApp()}async function deleteCalendarEvent(id){const e=state.calendar.find(x=>x.id===id);if(!confirm('Remover obrigação?'))return;await remove('calendar',id);state.calendar=state.calendar.filter(x=>x.id!==id);renderApp()}
function team(){if(!guard('team'))return '';return `<div class="top"><div><h1>👥 Usuários e permissões</h1><div class="muted">Controle de funções e acesso do CRM</div></div></div><div class="section"><div class="statusbar">Seu acesso: <strong>${esc(state.user.email)}</strong> · <strong>${esc(roleNames[role()]||role())}</strong></div><p class="muted">Os perfis abaixo são contas reais do Supabase. O Administrador pode alterar a função de cada conta; as regras também são protegidas no banco.</p>${state.team.length?`<div class="tablewrap"><table><tr><th>E-mail</th><th>Função</th><th>Ação</th></tr>${state.team.map(u=>`<tr><td>${esc(u.email||'')}</td><td><span class="badge">${esc(roleNames[u.role]||u.role)}</span></td><td><select class="input" style="min-width:170px" onchange="changeUserRole('${u.id}',this.value)">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma conta encontrada.</div>'}</div><div class="section"><h2>Modelo de acesso</h2><div class="chips">${Object.entries(roleNames).map(([k,v])=>`<span class="chip"><strong>${v}</strong>: ${(rolePerms[k]||[]).length} módulos</span>`).join('')}</div></div>`} 
async function changeUserRole(id,newRole){if(!guard('team'))return;if(!confirm(`Alterar função para ${roleNames[newRole]}?`))return;const r=await sb.rpc('admin_set_user_role',{target_user_id:id,new_role:newRole});if(r.error){alert(r.error.message);return}toast('Função atualizada.');await loadProfile();await loadAll();renderApp()}
async function sendAgent(){const input=document.getElementById('agentInput');const msg=input?.value.trim();if(!msg)return;const history=state.agentHistory||[];state.agentHistory=history;state.agentHistory.push({role:'user',content:msg});renderAgentMessages();input.value='';const status=document.getElementById('agentStatus');if(status)status.textContent='Consultando dados atuais do CRM e executando o que for necessário...';try{const session=(await sb.auth.getSession()).data.session;if(!session)throw new Error('Sessão expirada. Entre novamente.');const r=await fetch(`${SUPABASE_URL}/functions/v1/cafe-padrim-agent`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({message:msg,history:history.slice(-11)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível falar com o agente.');state.agentHistory.push({role:'assistant',content:data.reply||'Sem resposta.'});await loadAll();renderApp()}catch(e){state.agentHistory.push({role:'assistant',content:`Não consegui concluir: ${e.message}`});renderAgentMessages()}finally{const st=document.getElementById('agentStatus');if(st)st.textContent='Dados consultados em tempo real a cada solicitação.'}}
function renderAgentMessages(){const box=document.getElementById('agentMessages');if(!box)return;box.innerHTML=(state.agentHistory||[]).map(m=>`<div class="bubble ${m.role==='user'?'user':'agent'}"><strong>${m.role==='user'?'Você':'PADIM'}</strong><br>${esc(m.content)}</div>`).join('')||'<div class="empty">Comece uma conversa com o PADIM.</div>';box.scrollTop=box.scrollHeight}
function togglePadim(){const p=document.getElementById('padimPanel');if(!p)return;p.classList.toggle('open');if(p.classList.contains('open')){renderPadimMessages();setTimeout(()=>document.getElementById('padimInput')?.focus(),80)}}
function renderPadimMessages(){const box=document.getElementById('padimMessages');if(!box)return;if(!state.agentHistory.length)state.agentHistory=[{role:'assistant',content:'Olá! Eu sou o PADIM, agente operacional do CAFÉ DO PADRIM. Posso consultar os dados atuais do CRM e executar atividades. Ex.: “crie uma tarefa para amanhã para ligar para João” ou “qual café está abaixo do estoque mínimo?”'}];box.innerHTML=state.agentHistory.map(m=>`<div class="bubble ${m.role==='user'?'user':'agent'}"><strong>${m.role==='user'?'Você':'PADIM'}</strong><br>${esc(m.content)}</div>`).join('');box.scrollTop=box.scrollHeight}
function agentQuickFloating(t){const i=document.getElementById('padimInput');if(i){i.value=t;sendAgentFloating()}}
async function sendAgentFloating(){const input=document.getElementById('padimInput');const msg=input?.value.trim();if(!msg)return;const history=state.agentHistory||[];state.agentHistory=history;state.agentHistory.push({role:'user',content:msg});input.value='';renderPadimMessages();const status=document.getElementById('padimStatus');if(status)status.textContent='Consultando dados atuais do CRM e executando o que for necessário...';try{const session=(await sb.auth.getSession()).data.session;if(!session)throw new Error('Sessão expirada. Entre novamente.');const r=await fetch(`${SUPABASE_URL}/functions/v1/cafe-padrim-agent`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({message:msg,history:history.slice(-11)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível falar com o agente.');state.agentHistory.push({role:'assistant',content:data.reply||'Sem resposta.'});await loadAll();renderApp();setTimeout(renderPadimMessages,0)}catch(e){state.agentHistory.push({role:'assistant',content:`Não consegui concluir: ${e.message}`});renderPadimMessages()}finally{const st=document.getElementById('padimStatus');if(st)st.textContent='Dados consultados em tempo real a cada solicitação.'}}
function agent(){if(!state.agentHistory.length)state.agentHistory=[{role:'assistant',content:'Olá! Eu sou o PADIM, agente operacional do CAFÉ DO PADRIM. Consulto os dados atuais do CRM a cada solicitação, organizo informações e posso executar atividades. Ex.: “crie uma tarefa para amanhã para ligar para João” ou “qual café está abaixo do estoque mínimo?”'}];return `<div class="top"><div><h1>🤖 Agente PADIM</h1><div class="muted">Agente operacional conectado aos dados atuais do CRM</div></div><div class="toolbar"><button class="secondary" onclick="state.agentHistory=[];renderApp()">Nova conversa</button><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar dados</button></div></div><div class="section"><div class="agentquick"><button onclick="agentQuickFloating('Faça um resumo da operação atual.')">Resumo da operação</button><button onclick="agentQuickFloating('Quais cafés precisam de reposição?')">Estoque</button><button onclick="agentQuickFloating('Quais tarefas e obrigações estão pendentes?')">Pendências</button><button onclick="agentQuickFloating('Quais são os melhores clientes por vendas concluídas?')">Melhores clientes</button></div><div class="agentbox"><div id="agentMessages" class="agentmessages"></div><div id="agentStatus" class="agentstatus">Dados consultados em tempo real a cada solicitação.</div><div class="agentcomposer"><textarea id="agentInput" class="input" placeholder="Converse com o PADIM..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAgent()}"></textarea><button class="primary" onclick="sendAgent()">Enviar</button></div></div></div>`}
function agentQuick(t){const i=document.getElementById('agentInput');if(i){i.value=t;sendAgent()}}

function daysFromToday(date){if(!date)return 9999;return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}
function completedRevenue(){return state.orders.filter(o=>o.status==='Concluído').reduce((s,o)=>s+Number(o.total||0),0)}
function myDay(){if(!guard('myday'))return '';const today=dateNow();const overdueTasks=state.tasks.filter(t=>t.status!=='Concluída'&&t.date&&t.date<today);const todayTasks=state.tasks.filter(t=>t.status!=='Concluída'&&t.date===today);const due=state.receivables.filter(r=>r.status!=='Pago').sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date)));const lateReceivables=due.filter(r=>r.due_date&&r.due_date<today);const upcoming=state.calendar.filter(e=>!e.completed&&e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);const low=state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0));const stale=state.customers.filter(c=>{const os=state.orders.filter(o=>o.customer_id===c.id&&o.status==='Concluído');const last=os.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];return last&&daysFromToday(last.date)>30}).slice(0,6);return `<div class="top"><div><h1>🏠 Meu Dia</h1><div class="muted">Tudo que merece sua atenção hoje, em um só lugar.</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="heroAction"><div><strong>Bom dia! 👋</strong><div class="muted">O PADIM organizou os principais pontos da operação.</div></div><button class="primary" onclick="togglePadim();setTimeout(()=>{const i=document.getElementById('padimInput');if(i){i.value='Analise o que eu preciso priorizar hoje.';sendAgentFloating()}},120)">🤖 Perguntar ao PADIM</button></div><div class="grid4"><div class="kpi"><span>Pedidos hoje</span><strong>${state.orders.filter(o=>o.date===today&&o.status!=='Cancelado').length}</strong></div><div class="kpi"><span>Tarefas atrasadas</span><strong>${overdueTasks.length}</strong></div><div class="kpi"><span>A receber</span><strong>${money(due.reduce((s,r)=>s+Number(r.amount||0),0))}</strong></div><div class="kpi"><span>Estoque crítico</span><strong>${low.length}</strong></div></div><div class="grid"><div class="section"><h2>🔴 Precisa de atenção</h2><div class="actionlist">${lateReceivables.slice(0,4).map(r=>`<div class="alertrow"><div><strong><span class="priority-dot red"></span>${esc(r.description||'Conta a receber')}</strong><span class="muted">${esc(r.customer_name||'')} · vencida em ${dateBR(r.due_date)}</span></div><strong>${money(r.amount)}</strong></div>`).join('')}${overdueTasks.slice(0,4).map(t=>`<div class="alertrow"><div><strong><span class="priority-dot red"></span>${esc(t.title)}</strong><span class="muted">Tarefa atrasada · ${dateBR(t.date)}</span></div><button class="secondary" onclick="go('tasks')">Resolver</button></div>`).join('')}${low.slice(0,4).map(c=>`<div class="alertrow"><div><strong><span class="priority-dot"></span>${esc(c.name)}</strong><span class="muted">Estoque ${coffee(c.stock_grams)} · mínimo ${coffee(c.min_stock_grams)}</span></div><button class="secondary" onclick="go('inventory')">Repor</button></div>`).join('')}${!lateReceivables.length&&!overdueTasks.length&&!low.length?'<div class="empty">Nenhuma urgência encontrada. Operação em dia. ✅</div>':''}</div></div><div class="section"><h2>📅 Hoje e próximos dias</h2>${todayTasks.map(t=>`<div class="alertrow"><div><strong>${esc(t.title)}</strong><span class="muted">Hoje · ${esc(t.responsible||'Sem responsável')}</span></div><button class="secondary" onclick="go('tasks')">Abrir</button></div>`).join('')}${upcoming.map(e=>`<div class="alertrow"><div><strong>${esc(e.title)}</strong><span class="muted">${dateBR(e.date)} · ${esc(e.type||'Obrigação')}</span></div><button class="secondary" onclick="go('calendar')">Abrir</button></div>`).join('')||'<div class="empty">Nenhum compromisso próximo.</div>'}</div></div><div class="grid"><div class="section"><h2>👤 Clientes para reativar</h2>${stale.map(c=>`<div class="alertrow"><div><strong>${esc(c.name)}</strong><span class="muted">Mais de 30 dias sem compra</span></div><button class="secondary" onclick="whatsappCustomer('${esc(c.phone||'')}','Olá, ${esc(c.name)}! Tudo bem? Posso te ajudar com uma nova reposição de café?')">💬 WhatsApp</button></div>`).join('')||'<div class="empty">Nenhum cliente parado por enquanto.</div>'}</div><div class="section"><h2>🤖 Sugestão</h2><p>Use o PADIM para resumir a operação, criar tarefas, registrar despesas ou identificar clientes que precisam de contato.</p><button class="primary" onclick="togglePadim()">Abrir PADIM</button></div></div>`}
function alerts(){if(!guard('alerts'))return '';const today=dateNow();const items=[];state.coffees.filter(c=>Number(c.stock_grams||0)<=Number(c.min_stock_grams||0)).forEach(c=>items.push({p:'Alta',title:'Estoque abaixo do mínimo',desc:`${c.name}: ${coffee(c.stock_grams)} disponíveis.`}));state.tasks.filter(t=>t.status!=='Concluída'&&t.date&&t.date<today).forEach(t=>items.push({p:'Alta',title:'Tarefa atrasada',desc:`${t.title} · ${dateBR(t.date)}`}));state.receivables.filter(r=>r.status!=='Pago'&&r.due_date<today).forEach(r=>items.push({p:'Alta',title:'Conta vencida',desc:`${r.description||'Conta'} · ${money(r.amount)}`}));state.leads.filter(l=>l.stage!=='Venda realizada'&&l.updated_at&&daysFromToday(l.updated_at.slice(0,10))>7).forEach(l=>items.push({p:'Média',title:'Lead parado',desc:`${l.name||'Lead'} sem atualização há mais de 7 dias.`}));return `<div class="top"><div><h1>🔔 Alertas</h1><div class="muted">Problemas e oportunidades que merecem atenção.</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="section">${items.length?items.map(i=>`<div class="alertrow"><div><strong><span class="priority-dot ${i.p==='Alta'?'red':''}"></span>${esc(i.title)}</strong><span class="muted">${esc(i.desc)}</span></div><span class="badge ${i.p==='Alta'?'danger':'warn'}">${i.p}</span></div>`).join(''):'<div class="empty">Nenhum alerta. Tudo tranquilo. ✅</div>'}</div>`}
function receivables(){if(!guard('receivables'))return '';const open=state.receivables.filter(r=>r.status!=='Pago');const total=open.reduce((s,r)=>s+Number(r.amount||0),0),late=open.filter(r=>r.due_date<dateNow());return `<div class="top"><div><h1>💳 Contas a Receber</h1><div class="muted">Controle de valores pendentes e vencimentos.</div></div><button class="primary" onclick="newReceivable()">+ Conta a receber</button></div><div class="grid4"><div class="kpi"><span>Total em aberto</span><strong>${money(total)}</strong></div><div class="kpi"><span>Vencidas</span><strong>${money(late.reduce((s,r)=>s+Number(r.amount||0),0))}</strong></div><div class="kpi"><span>Quantidade</span><strong>${open.length}</strong></div><div class="kpi"><span>Pagas</span><strong>${state.receivables.filter(r=>r.status==='Pago').length}</strong></div></div><div class="section">${state.receivables.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr>${state.receivables.slice().sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date))).map(r=>`<tr><td>${esc(r.customer_name||'-')}</td><td>${esc(r.description||'-')}</td><td>${dateBR(r.due_date)}</td><td>${money(r.amount)}</td><td><span class="badge ${r.status==='Pago'?'ok':r.due_date<dateNow()?'danger':'warn'}">${esc(r.status)}</span></td><td>${r.status!=='Pago'?`<button class="secondary" onclick="payReceivable('${r.id}')">Marcar paga</button>`:''} <button class="dangerbtn" onclick="deleteReceivable('${r.id}')">Apagar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma conta cadastrada.</div>'}</div>`}
function newReceivable(){modal('Nova conta a receber',`<label>Cliente</label><input class="input" id="customer" placeholder="João Silva"><label>Descrição</label><input class="input" id="description" placeholder="Pedido #123"><div class="formgrid"><div><label>Valor</label><input class="input" id="amount" type="number" step="0.01"></div><div><label>Vencimento</label><input class="input" id="due" type="date" value="${dateNow()}"></div></div>`,async x=>{const amount=Number(x.querySelector('#amount').value)||0;if(amount<=0)return false;await insert('receivables',{customer_name:x.querySelector('#customer').value.trim(),description:x.querySelector('#description').value.trim(),amount,due_date:x.querySelector('#due').value,status:'Aberto'});await loadAll();renderApp();return true})}
async function payReceivable(id){await update('receivables',id,{status:'Pago',paid_at:new Date().toISOString()});await loadAll();renderApp()}
async function deleteReceivable(id){if(!confirm('Apagar esta conta?'))return;await remove('receivables',id);await loadAll();renderApp()}
function purchases(){if(!guard('purchases'))return '';const total=state.purchases.reduce((s,p)=>s+Number(p.total||0),0);return `<div class="top"><div><h1>🛒 Compras</h1><div class="muted">Compras de café e insumos ligadas ao estoque.</div></div><button class="primary" onclick="newPurchase()">+ Compra</button></div><div class="grid4"><div class="kpi"><span>Total comprado</span><strong>${money(total)}</strong></div><div class="kpi"><span>Compras</span><strong>${state.purchases.length}</strong></div><div class="kpi"><span>Fornecedores</span><strong>${new Set(state.purchases.map(p=>p.supplier_name).filter(Boolean)).size}</strong></div><div class="kpi"><span>Este mês</span><strong>${money(state.purchases.filter(p=>monthKey(p.date)===monthKey(dateNow())).reduce((s,p)=>s+Number(p.total||0),0))}</strong></div></div><div class="section">${state.purchases.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Fornecedor</th><th>Café</th><th>Quantidade</th><th>Total</th><th>Status</th></tr>${state.purchases.slice().reverse().map(p=>`<tr><td>${dateBR(p.date)}</td><td>${esc(p.supplier_name||'-')}</td><td>${esc(p.coffee_name||'-')}</td><td>${coffee(p.grams)}</td><td>${money(p.total)}</td><td><span class="badge ${p.status==='Recebida'?'ok':'warn'}">${esc(p.status)}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma compra registrada.</div>'}</div>`}
function newPurchase(){modal('Nova compra',`<label>Fornecedor</label><input class="input" id="supplier" placeholder="Nome do fornecedor"><label>Café</label><select class="input" id="coffee">${state.coffees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Quantidade</label><input class="input" id="qty" type="number" min="0.01" step="0.01"></div><div><label>Unidade</label><select class="input" id="unit"><option value="kg">kg</option><option value="g">g</option></select></div><div><label>Custo total</label><input class="input" id="total" type="number" step="0.01"></div><div><label>Data</label><input class="input" id="date" type="date" value="${dateNow()}"></div></div><label><input id="receive" type="checkbox" checked> Já recebida e adicionar ao estoque</label>`,async x=>{const c=coffeeById(x.querySelector('#coffee').value),g=parseCoffee(x.querySelector('#qty').value,x.querySelector('#unit').value),total=Number(x.querySelector('#total').value)||0;if(!c||g<=0||total<0)return false;const received=x.querySelector('#receive').checked;await insert('purchases',{supplier_name:x.querySelector('#supplier').value.trim(),coffee_id:c.id,coffee_name:c.name,grams:g,total,date:x.querySelector('#date').value,status:received?'Recebida':'Pendente'});if(received){c.stock_grams=Number(c.stock_grams||0)+g;await update('coffees',c.id,{stock_grams:c.stock_grams});await insert('movements',{coffee_id:c.id,type:'Entrada',grams:g,date:x.querySelector('#date').value,reason:'Compra recebida'})}await loadAll();renderApp();return true})}
function printOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const c=coffeeById(o.coffee_id);const w=window.open('','_blank','width=800,height=900');if(!w)return;w.document.write(`<html><head><title>Pedido ${esc(o.customer)}</title><style>body{font-family:Arial;padding:40px;color:#241d18}h1{margin-bottom:4px}.line{border-top:1px solid #ddd;margin:20px 0}.total{font-size:24px;font-weight:700}</style></head><body><h1>☕ CAFÉ DO PADRIM</h1><div>Pedido · ${dateBR(o.date)}</div><div class="line"></div><h2>${esc(o.customer)}</h2><p>${esc(c?.name||'Café')} — ${coffee(o.coffee_grams)}</p><p>${esc(o.payment_method||'Pagamento não informado')} · ${esc(o.status)}</p><div class="line"></div><div class="total">Total: ${money(o.total)}</div><p>${esc(o.notes||'')}</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function whatsappCustomer(phone,msg){const n=String(phone||'').replace(/\\D/g,'');if(!n)return alert('Cliente sem telefone/WhatsApp cadastrado.');window.open('https://wa.me/55'+n+'?text='+encodeURIComponent(msg||''),'_blank')}
function customerWhatsapp(id){const c=customerById(id);if(c)whatsappCustomer(c.phone,`Olá, ${c.name}! Tudo bem? Passando para saber se você precisa de uma nova reposição de café.`)}
function photoInbox(){const i=document.getElementById('photoInboxInput');if(i)i.click()}
async function processPhotoInbox(input){const f=input?.files?.[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const session=(await sb.auth.getSession()).data.session;if(!session)throw new Error('Sessão expirada.');const resp=await fetch(`${SUPABASE_URL}/functions/v1/cafe-padrim-photo-parser`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({image:r.result})});const data=await resp.json();if(!resp.ok)throw new Error(data.error||'Não foi possível ler a foto.');await insert('note_inbox',{raw_text:data.raw_text||'Anotação capturada por foto',summary:data.summary||'Foto processada pelo PADIM',type:data.type||'incerto',confidence:data.confidence||0,parsed_json:data});await loadAll();renderApp();toast('Foto enviada para a Caixa de Entrada.')}catch(e){alert(e.message)}};r.readAsDataURL(f)}
function reports(){if(!guard('reports'))return '';const completed=state.orders.filter(o=>String(o.status||'').toLowerCase()==='concluído');const revenue=completed.reduce((a,o)=>a+Number(o.total||o.value||o.valor||0),0);const expenses=state.expenses.reduce((a,e)=>a+Number(e.amount||e.value||0),0);const commissions=state.commissions.reduce((a,c)=>a+Number(c.amount||0),0);const byStage={};state.leads.forEach(l=>byStage[l.stage]=(byStage[l.stage]||0)+1);const top=state.customers.map(c=>({name:c.name,total:completed.filter(o=>o.customer_id===c.id||o.customer_name===c.name).reduce((a,o)=>a+Number(o.total||o.value||0),0)})).sort((a,b)=>b.total-a.total).slice(0,5);return `<div class="top"><div><h1>📈 Relatórios gerenciais</h1><div class="muted">Visão consolidada para decisão do negócio</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="grid4"><div class="kpi"><span>Faturamento</span><strong>${money(revenue)}</strong></div><div class="kpi"><span>Despesas</span><strong>${money(expenses)}</strong></div><div class="kpi"><span>Comissões</span><strong>${money(commissions)}</strong></div><div class="kpi"><span>Resultado estimado</span><strong>${money(revenue-expenses-commissions)}</strong></div></div><div class="section"><h2>Funil de leads</h2><div class="chips">${Object.entries(byStage).map(([k,v])=>`<span class="chip">${esc(k)}: <strong>${v}</strong></span>`).join('')||'<span class="muted">Sem leads.</span>'}</div></div><div class="section"><h2>Top clientes</h2>${top.length?`<div class="tablewrap"><table><tr><th>#</th><th>Cliente</th><th>Vendas concluídas</th></tr>${top.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${money(x.total)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Ainda não há vendas concluídas.</div>'}</div><div class="section"><h2>💡 Indicadores inteligentes</h2><div class="statline"><span>Ticket médio concluído</span><strong>${completed.length?money(revenue/completed.length):money(0)}</strong></div><div class="statline"><span>Margem após despesas/comissões</span><strong>${money(revenue-expenses-commissions)}</strong></div><div class="statline"><span>Estoque total</span><strong>${coffee(state.coffees.reduce((s,c)=>s+Number(c.stock_grams||0),0))}</strong></div><div class="statline"><span>Leads em aberto</span><strong>${state.leads.filter(l=>l.stage!=='Venda realizada').length}</strong></div></div>`}
function audit(){if(!guard('audit'))return '';return `<div class="top"><div><h1>🛡️ Auditoria</h1><div class="muted">Histórico de alterações realizadas no CRM</div></div><button class="primary" onclick="loadAll().then(()=>renderApp())">↻ Atualizar</button></div><div class="section">${state.audit.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Ação</th><th>Módulo</th><th>Usuário</th></tr>${state.audit.map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('pt-BR')}</td><td><span class="badge">${esc(a.action)}</span></td><td>${esc(a.table_name||'')}</td><td>${esc(a.user_email||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum evento registrado ainda.</div>'}</div>`}
function profile(){const email=state.user.email||'';return `<div class="top"><div><h1>PERFIL</h1><div class="muted">Sua conta do CAFÉ DO PADRIM V24</div></div></div><div class="profileHero"><div class="avatar">${initials(email)}</div><div><strong>${esc(email)}</strong><div class="profileEmail">Função: ${esc(roleNames[role()]||role())}</div></div></div><div class="section"><h2>Conta</h2><div class="profileActions"><button class="primary" onclick="changePassword()">Alterar senha</button><button class="secondary" onclick="logout()">Sair da conta</button></div></div><div class="section" style="margin-top:14px"><h2>Arquitetura V24</h2><div class="chips"><span class="chip">Clientes</span><span class="chip">Pedidos inteligentes</span><span class="chip">Estoque automático</span><span class="chip">Financeiro</span><span class="chip">WhatsApp</span><span class="chip">Alertas</span><span class="chip">Equipe</span><span class="chip">Agente PADIM</span></div></div>`}
async function changePassword(){const p=prompt('Nova senha:');if(!p)return;const p2=prompt('Repita:');if(p!==p2)return alert('As senhas não conferem.');const r=await sb.auth.updateUser({password:p});if(r.error)alert(r.error.message);else toast('Senha alterada')}
function renderApp(){if(!state.user)return;if(!document.getElementById('app'))shell();layout();const pages={myday:myDay,inbox,dashboard,customers,leads,orders,coffees,suppliers,inventory,products,tasks,finance,commission,calendar,reports,team,audit,receivables,purchases,alerts,agent,profile};document.getElementById('app').innerHTML=pages[state.page]();if(state.page==='agent')requestAnimationFrame(renderAgentMessages);}
async function boot(){
 try{
  authScreen('login');
  const r=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado ao conectar ao Supabase.')),12000))]);
  const session=r?.data?.session;
  if(session)await start(session.user);
  sb.auth.onAuthStateChange((_e,s)=>{if(s&&!state.user)start(s.user).catch(e=>console.error(e));if(!s&&state.user){state.user=null;state.profile=null;authScreen('login')}});
 }catch(e){
  console.error(e);
  const root=document.getElementById('root');
  root.innerHTML=`<div class="auth"><section class="authcard"><div class="logo">☕</div><h1>CAFÉ DO PADRIM</h1><p class="sub">Não foi possível conectar ao sistema</p><div class="msg error" style="display:block">${esc(e.message||'Erro de conexão')}</div><p class="hint">Verifique sua internet, o projeto Supabase e tente novamente.</p><button class="primary fullbtn" onclick="location.reload()">TENTAR NOVAMENTE</button></section></div>`;
 }
}
boot();
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('padimPanel')?.classList.remove('open')});
</script></body></html>
