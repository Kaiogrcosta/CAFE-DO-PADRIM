const rolePerms={admin:['myday','inbox','dashboard','customers','leads','orders','coffees','suppliers','inventory','products','tasks','finance','commission','calendar','reports','team','audit','receivables','purchases','alerts','agent','profile'],vendedor:['myday','inbox','dashboard','customers','leads','orders','products','tasks','calendar','receivables','alerts','agent','profile'],operacional:['myday','inbox','dashboard','orders','coffees','suppliers','inventory','products','tasks','calendar','purchases','alerts','agent','profile'],financeiro:['myday','inbox','dashboard','customers','orders','finance','commission','reports','calendar','receivables','purchases','alerts','agent','profile'],consulta:['myday','inbox','dashboard','customers','orders','products','calendar','reports','alerts','agent','profile']};
function role(){return String(state.profile?.role||'vendedor').toLowerCase()}
function can(p){return (rolePerms[role()]||rolePerms.consulta).includes(p)}
function guard(p){if(!can(p)){toast('Acesso não permitido para esta função.');return false}return true}
const stages=['Novo Lead','Contato realizado','Interesse identificado','Proposta enviada','Negociação','Venda realizada'];
const statuses=['Novo','Confirmado','Em preparação','Pronto','Entregue','Concluído','Cancelado'];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0)}
function grams(v){return Math.max(0,Number(v)||0)}
function coffee(v){const g=grams(v);if(g>=1000){const kg=g/1000;return `${Number.isInteger(kg)?kg:kg.toLocaleString('pt-BR',{maximumFractionDigits:2})} kg (${g.toLocaleString('pt-BR')} g)`}return `${g.toLocaleString('pt-BR')} g`}
function parseCoffee(v,u){const n=Number(String(v).replace(',','.'))||0;return u==='kg'?n*1000:n}
function dateNow(){return new Date().toISOString().slice(0,10)}
function initials(email){return (email||'?').trim().slice(0,1).toUpperCase()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2600)}
function go(p){if(!can(p)){toast("Acesso não permitido para esta função.");return}state.page=p;const b=document.getElementById("activityBackdrop");if(b)b.classList.remove("open");renderApp()}
window.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("activityBackdrop")?.classList.remove("open")})
function authScreen(mode='login'){document.getElementById('root').innerHTML=`<div class="auth"><section class="authcard"><div class="logo">☕</div><h1>CAFÉ DO PADRIM</h1><p class="sub">${mode==='signup'?'Crie seu perfil':'Entre no seu perfil'}</p><label>E-mail</label><input class="input" id="authEmail" type="email" placeholder="seunome@gmail.com"><label>Senha</label><input class="input" id="authPass" type="password"><div>${mode==='signup'?'<label>Confirmar senha</label><input class="input" id="authPass2" type="password">':''}</div><button class="primary fullbtn" onclick="submitAuth('${mode}')">${mode==='signup'?'CRIAR PERFIL':'ENTRAR'}</button><button class="linkbtn" onclick="authScreen('${mode==='signup'?'login':'signup'}')">${mode==='signup'?'Já tenho um perfil':'Criar novo perfil'}</button>${mode==='login'?'<button class="linkbtn" onclick="forgotPassword()">Esqueci minha senha</button>':''}<div id="authMsg" class="msg"></div><div class="hint">V38 · Gestão inteligente + PADIM.</div></section></div>`}
async function submitAuth(mode){
 const btn=document.querySelector('.authcard .fullbtn'),email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPass').value,m=document.getElementById('authMsg');
 if(!email||!email.includes('@'))return showMsg(m,'Digite um e-mail válido.');
 if(!pass)return showMsg(m,'Digite uma senha.');
 if(mode==='signup'&&pass!==document.getElementById('authPass2').value)return showMsg(m,'As senhas não conferem.');
 if(btn){btn.disabled=true;btn.textContent='CONECTANDO...'}
 try{
  const r=mode==='signup'?await sb.auth.signUp({email,password:pass}):await sb.auth.signInWithPassword({email,password:pass});
  if(r.error)throw r.error;
  if(mode==='signup'&&!r.data.session){showMsg(m,'Perfil criado! Confirme o e-mail e depois entre.',true);return}
  if(!r.data.user)throw new Error('O Supabase não retornou o usuário.');
  await start(r.data.user);
 }catch(e){showMsg(m,e.message||'Não foi possível concluir o acesso.')}finally{if(btn){btn.disabled=false;btn.textContent=mode==='signup'?'CRIAR PERFIL':'ENTRAR'}}
}
function showMsg(el,text,ok=false){el.textContent=text;el.className='msg '+(ok?'ok':'error');el.style.display='block'}
async function forgotPassword(){const email=prompt('Digite o e-mail do perfil:');if(!email)return;const r=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.href});if(r.error)alert(r.error.message);else alert('Enviamos as instruções de recuperação.')}
async function start(user){
 if(!user)return;
 state.user=user;
 state.page='myday';
 renderApp();
 try{await loadProfile();renderApp()}catch(e){console.warn('Falha ao carregar perfil',e)}
 try{await loadAll();renderApp()}catch(e){console.error('Falha ao carregar dados',e);toast('Entrou, mas alguns dados não puderam ser carregados.')} 
}
async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(r.error)console.warn(r.error);state.profile=r.data||{id:state.user.id,email:state.user.email,role:'admin'}}
async function loadAll(){
 const tables=['note_inbox','customers','leads','products','orders','tasks','commissions','calendar','coffees','suppliers','movements','expenses','team','receivables','purchases'];
 const results=await Promise.all(tables.map(async t=>{try{const r=await sb.from(t).select('*');if(r.error){console.warn('Erro ao carregar '+t,r.error.message);return [t,[]]}const data=(r.data||[]).slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));return [t,data]}catch(e){console.warn('Tabela indisponível:',t,e);return [t,[]]}}));
 results.forEach(([t,data])=>state[t]=data);
 if(role()==='admin'){try{const r=await sb.rpc('admin_list_profiles');state.team=r.error?[]:(r.data||[])}catch(e){state.team=[]} try{const r=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(300);state.audit=r.error?[]:(r.data||[])}catch(e){state.audit=[]}} else {state.team=[];state.audit=[]}
 try{await ensureTaskCalendars()}catch(e){console.warn('Sincronização calendário:',e)}
}
async function insert(t,row){const r=await sb.from(t).insert({...row,user_id:state.user.id}).select().single();if(r.error)throw r.error;return r.data}
async function update(t,id,row){const r=await sb.from(t).update(row).eq('id',id);if(r.error)throw r.error;return r.data}
async function remove(t,id){const r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error}
async function logout(){await sb.auth.signOut();state.user=null;state.profile=null;authScreen('login')}
